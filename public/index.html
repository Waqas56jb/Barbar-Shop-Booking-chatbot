<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Barbería Cullera — Book your appointment</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:          #0b0b0b;
      --surface:     #141414;
      --card:        #1c1c1c;
      --card2:       #222222;
      --border:      #282828;
      --border2:     #333333;
      --gold:        #c9a84c;
      --gold-dim:    #9e7a30;
      --gold-glow:   rgba(201,168,76,.15);
      --gold-light:  #dfc06a;
      --cream:       #f2ede3;
      --text:        #e6e2d9;
      --text-muted:  #808080;
      --text-dim:    #555;
      --user-bg:     #c9a84c;
      --user-text:   #0b0b0b;
      --bot-bg:      #1c1c1c;
      --success:     #3fb950;
      --danger:      #f85149;
      --radius:      20px;
      --radius-sm:   12px;
      --font-serif:  'Playfair Display', Georgia, serif;
      --font-sans:   'DM Sans', system-ui, sans-serif;
      --safe-top:    env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left:   env(safe-area-inset-left, 0px);
      --safe-right:  env(safe-area-inset-right, 0px);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; -webkit-text-size-adjust: 100%; }
    body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    a { color: var(--gold); text-decoration: none; }
    a:hover { text-decoration: underline; }
    button { font-family: var(--font-sans); }

    .shell {
      width: 100%;
      max-width: 430px;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      position: relative;
      background: var(--surface);
      overflow: hidden;
    }
    @media (min-width: 500px) {
      body { background: #060606; }
      .shell {
        height: min(840px, 96dvh);
        border-radius: 26px;
        border: 1px solid var(--border);
        box-shadow:
          0 40px 100px rgba(0,0,0,.8),
          0 0 0 1px rgba(201,168,76,.06),
          inset 0 1px 0 rgba(255,255,255,.03);
      }
    }

    .header {
      flex-shrink: 0;
      padding: calc(14px + var(--safe-top)) 14px 13px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 11px;
      position: relative;
      z-index: 20;
    }
    .header::after {
      content: '';
      position: absolute;
      bottom: -1px; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent 0%, var(--gold-dim) 40%, var(--gold) 50%, var(--gold-dim) 60%, transparent 100%);
      opacity: .6;
    }

    .avatar {
      width: 46px; height: 46px;
      border-radius: 50%;
      background: conic-gradient(var(--gold-dim) 0deg 120deg, #fff 120deg 180deg, #c0392b 180deg 240deg, var(--gold-dim) 240deg 360deg);
      display: flex; align-items: center; justify-content: center;
      font-size: 21px;
      flex-shrink: 0;
      position: relative;
      box-shadow: 0 0 0 2px var(--surface), 0 0 0 3.5px var(--gold-dim);
      animation: spin-avatar 12s linear infinite;
    }
    @keyframes spin-avatar {
      to { background-position: 360deg; }
    }
    .avatar::after {
      content: '';
      width: 12px; height: 12px;
      background: var(--success);
      border-radius: 50%;
      border: 2.5px solid var(--surface);
      position: absolute;
      bottom: 0px; right: 0px;
      animation: pulse-dot 2s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { box-shadow: 0 0 0 0 rgba(63,185,80,.4); }
      50%       { box-shadow: 0 0 0 5px rgba(63,185,80,0); }
    }

    .header-info { flex: 1; min-width: 0; }
    .shop-name {
      font-family: var(--font-serif);
      font-size: 1rem;
      font-weight: 700;
      color: var(--gold-light);
      letter-spacing: .02em;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .shop-sub {
      font-size: .68rem;
      color: var(--success);
      font-weight: 500;
      margin-top: 2px;
      letter-spacing: .03em;
    }

    .hdr-actions { display: flex; gap: 6px; }
    .icon-btn {
      width: 36px; height: 36px;
      border-radius: 50%;
      border: 1px solid var(--border2);
      background: var(--card);
      color: var(--text-muted);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      font-size: 15px;
      transition: background .18s, border-color .18s, transform .15s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .icon-btn:active { background: var(--card2); transform: scale(.9); }

    .messages {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 14px 12px 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }
    .messages::-webkit-scrollbar { width: 3px; }
    .messages::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

    .date-divider {
      display: flex; align-items: center; gap: 8px;
      color: var(--text-dim); font-size: .68rem;
      margin: 2px 0 4px;
      user-select: none;
    }
    .date-divider::before, .date-divider::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }

    .msg-row {
      display: flex;
      align-items: flex-end;
      gap: 7px;
      animation: rise .28s ease both;
    }
    .msg-row.user { flex-direction: row-reverse; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg-avatar-sm {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gold-dim), var(--gold));
      display: flex; align-items: center; justify-content: center;
      font-size: 13px;
      flex-shrink: 0;
      align-self: flex-end;
      position: relative;
      top: -2px;
    }
    .msg-row.user .msg-avatar-sm {
      background: linear-gradient(135deg, #3a3a3a, #1e1e1e);
    }

    .bubble-wrap {
      display: flex;
      flex-direction: column;
      max-width: 80%;
    }
    .msg-row.user .bubble-wrap { align-items: flex-end; }

    .bubble {
      padding: 10px 14px;
      border-radius: var(--radius);
      font-size: .875rem;
      line-height: 1.55;
      word-break: break-word;
      hyphens: auto;
    }
    .msg-row.bot .bubble {
      background: var(--bot-bg);
      color: var(--text);
      border-bottom-left-radius: 5px;
      border: 1px solid var(--border);
    }
    .msg-row.user .bubble {
      background: var(--user-bg);
      color: var(--user-text);
      border-bottom-right-radius: 5px;
      font-weight: 500;
    }

    .bubble-time {
      font-size: .6rem;
      color: var(--text-dim);
      margin-top: 3px;
      padding: 0 2px;
    }
    .msg-row.user .bubble-time { text-align: right; color: rgba(0,0,0,.35); }

    .lead-badge {
      display: inline-flex; align-items: center; gap: 5px;
      background: rgba(63,185,80,.12);
      border: 1px solid rgba(63,185,80,.3);
      color: var(--success);
      font-size: .68rem;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 20px;
      margin-top: 8px;
      letter-spacing: .03em;
    }

    .typing-row { display: flex; align-items: flex-end; gap: 7px; }
    .typing-bubble {
      background: var(--bot-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      border-bottom-left-radius: 5px;
      padding: 13px 16px;
      display: flex; gap: 5px; align-items: center;
    }
    .dot {
      width: 7px; height: 7px;
      background: var(--text-muted);
      border-radius: 50%;
      animation: bounce 1.3s infinite ease-in-out both;
    }
    .dot:nth-child(2) { animation-delay: .18s; }
    .dot:nth-child(3) { animation-delay: .36s; }
    @keyframes bounce {
      0%,80%,100% { transform: translateY(0) scale(1); }
      40%          { transform: translateY(-6px) scale(1.1); }
    }

    .quick-replies {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      padding: 3px 0 2px 35px;
      max-width: 96%;
    }
    .qr-btn {
      padding: 8px 14px;
      border-radius: 22px;
      border: 1px solid var(--gold-dim);
      background: transparent;
      color: var(--gold-light);
      font-size: .78rem;
      font-weight: 500;
      cursor: pointer;
      transition: all .18s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      white-space: nowrap;
    }
    .qr-btn:active, .qr-btn:hover {
      background: var(--gold-glow);
      border-color: var(--gold);
      color: var(--gold);
    }

    .service-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding-left: 35px;
      max-width: 95%;
    }
    .svc-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: border-color .18s, background .18s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .svc-card:active, .svc-card:hover {
      border-color: var(--gold-dim);
      background: var(--gold-glow);
    }
    .svc-name { font-size: .82rem; font-weight: 500; color: var(--text); }
    .svc-price { font-family: var(--font-serif); color: var(--gold); font-size: .92rem; font-weight: 700; flex-shrink: 0; margin-left: 10px; }

    .info-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 13px 15px;
      font-size: .8rem;
      line-height: 1.65;
      margin-left: 35px;
      max-width: 88%;
    }
    .ic-title {
      font-weight: 700;
      color: var(--gold);
      font-size: .84rem;
      margin-bottom: 7px;
      display: flex; align-items: center; gap: 6px;
    }
    .ic-row { color: var(--text); }
    .ic-label { color: var(--text-muted); font-size: .71rem; }
    .ic-closed { color: var(--text-dim); font-style: italic; }

    .booking-card {
      margin-left: 0;
      max-width: 100%;
      padding: 14px 15px 16px;
    }
    .booking-card .bf-field { margin-bottom: 11px; }
    .booking-card .bf-field:last-of-type { margin-bottom: 0; }
    .booking-card label {
      display: block;
      font-size: .68rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-bottom: 5px;
    }
    .booking-card input,
    .booking-card select,
    .booking-card textarea {
      width: 100%;
      background: var(--card2);
      border: 1px solid var(--border2);
      border-radius: 10px;
      color: var(--text);
      font-family: var(--font-sans);
      font-size: .82rem;
      padding: 9px 11px;
      outline: none;
    }
    .booking-card input:focus,
    .booking-card select:focus,
    .booking-card textarea:focus {
      border-color: var(--gold-dim);
    }
    .booking-card textarea {
      min-height: 64px;
      resize: vertical;
      max-height: 120px;
    }
    .booking-error {
      font-size: .75rem;
      color: var(--danger);
      margin-top: 8px;
      margin-bottom: 4px;
      display: none;
    }
    .booking-error.visible { display: block; }
    .btn-confirm-booking {
      width: 100%;
      margin-top: 14px;
      padding: 12px 16px;
      border: none;
      border-radius: 22px;
      background: linear-gradient(145deg, var(--gold-dim), var(--gold));
      color: #0b0b0b;
      font-size: .85rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 3px 14px rgba(201,168,76,.3);
      transition: transform .15s, box-shadow .2s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .btn-confirm-booking:active { transform: scale(.98); box-shadow: none; }
    .btn-confirm-booking:disabled { opacity: .55; cursor: default; transform: none; }

    .success-card {
      margin-left: 0;
      max-width: 100%;
      border-color: rgba(201,168,76,.35);
      background: linear-gradient(165deg, var(--card) 0%, rgba(201,168,76,.06) 100%);
    }
    .success-card .success-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(201,168,76,.2);
      border: 1px solid var(--gold-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      color: var(--gold-light);
      margin-bottom: 10px;
    }
    .success-card h3 {
      font-family: var(--font-serif);
      font-size: 1.05rem;
      color: var(--gold-light);
      margin-bottom: 10px;
    }
    .success-card .success-summary {
      font-size: .82rem;
      color: var(--text);
      line-height: 1.55;
      margin-bottom: 10px;
    }
    .success-card .success-note {
      font-size: .75rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .input-area {
      flex-shrink: 0;
      padding: 10px 10px calc(10px + var(--safe-bottom));
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: flex-end;
      gap: 8px;
      position: relative;
    }
    .input-area::before {
      content: '';
      position: absolute;
      top: -1px; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
      opacity: .5;
    }

    .input-wrap {
      flex: 1;
      background: var(--card);
      border: 1px solid var(--border2);
      border-radius: 24px;
      display: flex;
      align-items: flex-end;
      transition: border-color .2s;
      overflow: hidden;
    }
    .input-wrap:focus-within { border-color: var(--gold-dim); }

    #userInput {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: var(--font-sans);
      font-size: .875rem;
      padding: 11px 14px;
      resize: none;
      max-height: 110px;
      line-height: 1.45;
      caret-color: var(--gold);
      scrollbar-width: none;
    }
    #userInput::-webkit-scrollbar { display: none; }
    #userInput::placeholder { color: var(--text-dim); }

    .send-btn {
      width: 44px; height: 44px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(145deg, var(--gold-dim), var(--gold));
      color: #0b0b0b;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      font-size: 17px;
      flex-shrink: 0;
      transition: transform .15s, box-shadow .2s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      box-shadow: 0 3px 14px rgba(201,168,76,.3);
    }
    .send-btn:active { transform: scale(.9); box-shadow: none; }
    .send-btn:disabled { opacity: .5; cursor: default; }

  </style>
</head>
<body>

<div class="shell" id="shell">

  <div class="header">
    <div class="avatar">✂️</div>
    <div class="header-info">
      <div class="shop-name">Barbería Cullera</div>
      <div class="shop-sub">● Reception · Happy to help</div>
    </div>
    <div class="hdr-actions">
      <a class="icon-btn" href="tel:617545837" title="Call us" aria-label="Call us">📞</a>
      <button class="icon-btn" type="button" title="Location" aria-label="Location" onclick="window.open('https://maps.google.com/?q=Carrer+Ateneu+Musical+63a+Cullera+Valencia')">📍</button>
    </div>
  </div>

  <div class="messages" id="messages">
    <div class="date-divider" id="dateDivider">Today</div>
  </div>

  <div class="input-area">
    <div class="input-wrap">
      <textarea
        id="userInput"
        rows="1"
        placeholder="Type a message…"
        autocomplete="off"
        autocorrect="on"
        spellcheck="true"
      ></textarea>
    </div>
    <button class="send-btn" id="sendBtn" aria-label="Send message">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>

</div>

<script>
const SHOP = {
  phone:   "617545837",
  phoneFmt: "617 54 58 37",
  mapLink: "https://maps.google.com/?q=Carrer+Ateneu+Musical+63a+Cullera+Valencia",
  address: "Carrer Ateneu Musical, 63a, 46400 Cullera, Valencia, Spain",
  services: [
    { name: "Haircut",                                      price: 16 },
    { name: "Haircut + Beard Trim",                         price: 21 },
    { name: "Beard Grooming",                               price: 11 },
    { name: "Haircut + Beard + Steam Shave + Head Massage", price: 30 },
    { name: "Fade",                                         price: 14 },
    { name: "Shave + Fade + Beard",                         price: 19 },
    { name: "Haircut + Design / Pattern",                   price: 18 },
    { name: "Highlights",                                   price: 40 },
    { name: "Full Color",                                   price: 60 },
  ],
  hours: [
    { day: "Monday",    time: "Closed",                          open: false },
    { day: "Tuesday",   time: "10:00–13:30  /  15:30–20:00",    open: true  },
    { day: "Wednesday", time: "10:00–13:30  /  15:30–20:00",    open: true  },
    { day: "Thursday",  time: "10:00–13:30  /  15:30–20:00",    open: true  },
    { day: "Friday",    time: "10:00–13:30  /  15:30–20:00",    open: true  },
    { day: "Saturday",  time: "10:00–15:00",                     open: true  },
    { day: "Sunday",    time: "Closed",                          open: false },
  ]
};

/** Same-origin relative URLs only work when this page is served by the app (e.g. http://localhost:3000). Opening the HTML file directly (file://) would otherwise request file:///…/api/chat — use a real base URL instead. */
let API_BASE = '';
try {
  const fromQuery = new URLSearchParams(window.location.search).get('api');
  if (fromQuery) {
    API_BASE = fromQuery.replace(/\/$/, '');
  } else if (location.protocol !== 'http:' && location.protocol !== 'https:') {
    API_BASE = 'http://localhost:3000';
  }
} catch (_) {
  API_BASE = 'http://localhost:3000';
}
const BACKEND_CHAT = `${API_BASE}/api/chat`;
const BACKEND_BOOK = `${API_BASE}/api/book`;

function clientDeviceHint() {
  try {
    return window.matchMedia && window.matchMedia('(max-width: 768px)').matches ? 'mobile' : 'desktop';
  } catch (_) {
    return null;
  }
}
const BOOKING_TRIGGER = "SHOW_BOOKING_FORM";
if (API_BASE) {
  if (API_BASE) console.info('[Chat] API:', API_BASE);
}

let sessionId   = null;
let isTyping    = false;

const $msgs    = document.getElementById('messages');
const $input   = document.getElementById('userInput');
const $sendBtn = document.getElementById('sendBtn');

function nowTime() {
  return new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
}
function scrollBottom() {
  $msgs.scrollTo({ top: $msgs.scrollHeight, behavior: 'smooth' });
}

function stripBookingTrigger(text) {
  if (!text) return '';
  return text
    .split(/\r?\n/)
    .filter(line => line.trim() !== BOOKING_TRIGGER)
    .join('\n')
    .replace(/\n{3,}/g, '\n\n')
    .trim();
}

function addMessage(role, html, showLeadBadge = false) {
  const row  = document.createElement('div');
  row.className = `msg-row ${role}`;

  const av   = document.createElement('div');
  av.className = 'msg-avatar-sm';
  av.textContent = role === 'bot' ? '✂️' : '👤';

  const wrap = document.createElement('div');
  wrap.className = 'bubble-wrap';

  const bub  = document.createElement('div');
  bub.className = 'bubble';
  bub.innerHTML = html.replace(/\n/g, '<br>');

  const ts   = document.createElement('span');
  ts.className = 'bubble-time';
  ts.textContent = nowTime();

  wrap.appendChild(bub);

  if (showLeadBadge) {
    const badge = document.createElement('div');
    badge.className = 'lead-badge';
    badge.textContent = '✅ Booking saved';
    wrap.appendChild(badge);
  }

  wrap.appendChild(ts);

  if (role === 'bot') { row.appendChild(av); row.appendChild(wrap); }
  else                { row.appendChild(wrap); row.appendChild(av); }

  $msgs.appendChild(row);
  scrollBottom();
}

/**
 * Quick reply: string label or { label, message } — message is what is shown + sent (default: label).
 */
function addQuickReplies(options, containerId) {
  const wrap = document.createElement('div');
  wrap.className = 'quick-replies';
  wrap.id = containerId || '';

  options.forEach(opt => {
    const label = typeof opt === 'string' ? opt : opt.label;
    const message = typeof opt === 'string' ? opt : (opt.message ?? opt.label);
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'qr-btn';
    btn.textContent = label;
    btn.addEventListener('click', () => {
      wrap.remove();
      sendMessage(message);
    });
    wrap.appendChild(btn);
  });

  $msgs.appendChild(wrap);
  scrollBottom();
}

function addServiceCards(items) {
  const list = document.createElement('div');
  list.className = 'service-list';

  items.forEach(item => {
    const card = document.createElement('div');
    card.className = 'svc-card';
    card.innerHTML = `<span class="svc-name">${item.name}</span><span class="svc-price">€${item.price}</span>`;
    card.addEventListener('click', () => {
      list.remove();
      sendMessage(`I'd like to book: ${item.name} (€${item.price})`);
    });
    list.appendChild(card);
  });

  $msgs.appendChild(list);
  scrollBottom();
}

function addInfoCard(titleHtml, bodyHtml) {
  const card = document.createElement('div');
  card.className = 'info-card';
  card.innerHTML = `<div class="ic-title">${titleHtml}</div>${bodyHtml}`;
  $msgs.appendChild(card);
  scrollBottom();
}

function showTyping() {
  const row = document.createElement('div');
  row.className = 'typing-row';
  row.id = 'typingIndicator';

  const av = document.createElement('div');
  av.className = 'msg-avatar-sm';
  av.textContent = '✂️';

  const bub = document.createElement('div');
  bub.className = 'typing-bubble';
  bub.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';

  row.appendChild(av);
  row.appendChild(bub);
  $msgs.appendChild(row);
  scrollBottom();
}
function hideTyping() {
  const el = document.getElementById('typingIndicator');
  if (el) el.remove();
}

function todayISODate() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function guessPrefillFromChat() {
  const texts = [...$msgs.querySelectorAll('.msg-row.user .bubble')]
    .map(b => b.textContent.trim())
    .filter(Boolean);
  if (texts.length === 0) return { name: '', phone: '' };
  const last = texts[texts.length - 1];
  const prev = texts[texts.length - 2] || '';
  const digits = last.replace(/\D/g, '');
  if (digits.length >= 9) return { name: prev, phone: last };
  return { name: '', phone: '' };
}

function removeExistingBookingForms() {
  $msgs.querySelectorAll('[data-booking-form="1"]').forEach(el => el.remove());
}

function renderSuccessCard({ name, service, preferredDate, preferredTime }) {
  const row = document.createElement('div');
  row.className = 'msg-row bot';

  const av = document.createElement('div');
  av.className = 'msg-avatar-sm';
  av.textContent = '✂️';

  const wrap = document.createElement('div');
  wrap.className = 'bubble-wrap';

  const card = document.createElement('div');
  card.className = 'info-card success-card';
  card.innerHTML = `
    <div class="success-icon" aria-hidden="true">✓</div>
    <h3>Appointment Requested!</h3>
    <div class="success-summary">
      <strong>${escapeHtml(name)}</strong><br>
      ${escapeHtml(service)}<br>
      ${escapeHtml(preferredDate || '—')} · ${escapeHtml(preferredTime || '—')}
    </div>
    <div class="success-note">We'll confirm by phone at <a href="tel:${SHOP.phone}">${SHOP.phoneFmt}</a>.</div>
    <div class="lead-badge">✅ Booking saved</div>
  `;

  const ts = document.createElement('span');
  ts.className = 'bubble-time';
  ts.textContent = nowTime();

  wrap.appendChild(card);
  wrap.appendChild(ts);
  row.appendChild(av);
  row.appendChild(wrap);
  $msgs.appendChild(row);
  scrollBottom();
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function renderBookingForm() {
  removeExistingBookingForms();
  const pre = guessPrefillFromChat();

  const row = document.createElement('div');
  row.className = 'msg-row bot';
  row.dataset.bookingForm = '1';

  const av = document.createElement('div');
  av.className = 'msg-avatar-sm';
  av.textContent = '✂️';

  const wrap = document.createElement('div');
  wrap.className = 'bubble-wrap';

  const card = document.createElement('div');
  card.className = 'info-card booking-card';

  const serviceOptions = SHOP.services
    .map(s => `<option value="${escapeHtml(s.name)}">${escapeHtml(s.name)} — €${s.price}</option>`)
    .join('');

  card.innerHTML = `
    <div class="ic-title">📅 Confirm your appointment</div>
    <form class="booking-form-inner" novalidate>
      <div class="bf-field">
        <label for="bf-name">Name</label>
        <input type="text" id="bf-name" name="name" required maxlength="120" value="${escapeHtml(pre.name)}" autocomplete="name" />
      </div>
      <div class="bf-field">
        <label for="bf-phone">Phone</label>
        <input type="tel" id="bf-phone" name="phone" required maxlength="40" value="${escapeHtml(pre.phone)}" autocomplete="tel" />
      </div>
      <div class="bf-field">
        <label for="bf-service">Service</label>
        <select id="bf-service" name="service" required>
          <option value="" disabled selected>Select a service…</option>
          ${serviceOptions}
        </select>
      </div>
      <div class="bf-field">
        <label for="bf-date">Preferred date</label>
        <input type="date" id="bf-date" name="preferredDate" required min="${todayISODate()}" />
      </div>
      <div class="bf-field">
        <label for="bf-time">Preferred time</label>
        <select id="bf-time" name="preferredTime" required>
          <option value="" disabled selected>Select a time…</option>
          <option value="Morning (10:00–13:30)">Morning (10:00–13:30)</option>
          <option value="Afternoon (15:30–20:00)">Afternoon (15:30–20:00)</option>
          <option value="Saturday morning (10:00–15:00)">Saturday morning (10:00–15:00)</option>
        </select>
      </div>
      <div class="bf-field">
        <label for="bf-notes">Notes <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--text-dim)">(optional)</span></label>
        <textarea id="bf-notes" name="notes" maxlength="200" placeholder="Any special requests?"></textarea>
      </div>
      <div class="booking-error" role="alert"></div>
      <button type="submit" class="btn-confirm-booking">Confirm Appointment ✅</button>
    </form>
  `;

  const ts = document.createElement('span');
  ts.className = 'bubble-time';
  ts.textContent = nowTime();

  wrap.appendChild(card);
  wrap.appendChild(ts);
  row.appendChild(av);
  row.appendChild(wrap);
  $msgs.appendChild(row);
  scrollBottom();

  const form = card.querySelector('.booking-form-inner');
  const errEl = card.querySelector('.booking-error');
  const submitBtn = card.querySelector('.btn-confirm-booking');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errEl.classList.remove('visible');
    errEl.textContent = '';

    const name = (form.querySelector('#bf-name').value || '').trim();
    const phone = (form.querySelector('#bf-phone').value || '').trim();
    const service = (form.querySelector('#bf-service').value || '').trim();
    const preferredDate = (form.querySelector('#bf-date').value || '').trim();
    const preferredTime = (form.querySelector('#bf-time').value || '').trim();
    const notes = (form.querySelector('#bf-notes').value || '').trim();

    if (!name || !phone || !service || !preferredDate || !preferredTime) {
      errEl.textContent = 'Please fill in all required fields.';
      errEl.classList.add('visible');
      return;
    }
    if (notes.length > 200) {
      errEl.textContent = 'Notes must be 200 characters or less.';
      errEl.classList.add('visible');
      return;
    }

    submitBtn.disabled = true;
    try {
      const res = await fetch(BACKEND_BOOK, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          sessionId,
          name,
          phone,
          service,
          preferredDate,
          preferredTime,
          notes,
        }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        errEl.textContent = data.error || 'Something went wrong. Please try again.';
        errEl.classList.add('visible');
        submitBtn.disabled = false;
        return;
      }
      row.remove();
      renderSuccessCard({ name, service, preferredDate, preferredTime });
    } catch {
      errEl.textContent = 'Network error. Check your connection and try again.';
      errEl.classList.add('visible');
      submitBtn.disabled = false;
    }
  });
}

/** Map booking CTAs (buttons / short phrases) to one line for the API — run once, no recursion. */
function normalizeBookingIntent(raw) {
  const trimmed = (raw || '').trim();
  if (!trimmed) return trimmed;
  const t = trimmed.toLowerCase();
  const stripped = t
    .replace(/\p{Extended_Pictographic}/gu, '')
    .replace(/\s+/g, ' ')
    .trim();

  if (/book online|book now|\breserve\b/.test(t)) {
    return "I'd like to book an appointment";
  }
  if (/^book an appointment$/.test(stripped) || /^book appointment$/.test(stripped) || /^book a slot$/.test(stripped)) {
    return "I'd like to book an appointment";
  }
  return trimmed;
}

function handleLocalShortcut(text) {
  const t = text.toLowerCase();

  if (/\b(services?|price|menu|list|how much|cost)\b/.test(t)) {
    addMessage('bot', 'Here\'s our full service menu — tap any one to book it directly:');
    addServiceCards(SHOP.services);
    return true;
  }

  if (/\b(hour|open|clos|when|time|schedule|avail)\b/.test(t)) {
    addMessage('bot', 'Here are our opening hours for the week:');
    const rows = SHOP.hours.map(h =>
      `<div class="ic-row">
        <span class="ic-label">${h.day}</span><br>
        <span class="${h.open ? '' : 'ic-closed'}">${h.time}</span>
      </div>`
    ).join('');
    addInfoCard('🕐 Opening Hours', rows);
    addQuickReplies([
      { label: 'Book a slot 📅', message: "I'd like to book an appointment" },
      'View services 💈',
      'Call us ☎️',
    ]);
    return true;
  }

  if (/\b(where|location|address|map|direct|find you|how to get)\b/.test(t)) {
    addMessage('bot', 'You can find us right here in Cullera:');
    addInfoCard('📍 Our Address',
      `<div class="ic-row">${SHOP.address}</div>
       <br>
       <div class="ic-row"><a href="${SHOP.mapLink}" target="_blank" rel="noopener">Open in Google Maps →</a></div>`
    );
    addQuickReplies([
      { label: 'Book appointment 📅', message: "I'd like to book an appointment" },
      'Our hours 🕐',
      'Call us ☎️',
    ]);
    return true;
  }

  if (/\b(call|phone|ring|number|contact)\b/.test(t)) {
    addMessage('bot', `You can reach us directly at <strong>${SHOP.phoneFmt}</strong> 📞`);
    addQuickReplies([
      'Call now ☎️',
      { label: 'Book appointment 📅', message: "I'd like to book an appointment" },
      'Our hours 🕐',
    ]);
    return true;
  }

  if (/call now/.test(t)) {
    window.location.href = `tel:${SHOP.phone}`;
    addMessage('bot', 'Dialling now… ☎️ Speak soon!');
    return true;
  }

  if (/\bwhatsapp\b/.test(t)) {
    addMessage('bot', 'You can book everything right here in this chat — no WhatsApp needed. Want to start with a service? ✂️');
    addQuickReplies([
      { label: 'Book an appointment 📅', message: "I'd like to book an appointment" },
      'See services 💈',
    ]);
    return true;
  }

  return false;
}

async function sendMessage(text) {
  text = (text || '').trim();
  if (!text || isTyping) return;

  const outbound = normalizeBookingIntent(text);

  addMessage('user', outbound);
  $input.value = '';
  $input.style.height = 'auto';

  if (handleLocalShortcut(outbound)) return;

  isTyping = true;
  $sendBtn.disabled = true;
  showTyping();

  try {
    const res = await fetch(BACKEND_CHAT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId, message: outbound, deviceHint: clientDeviceHint() }),
    });

    hideTyping();

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      addMessage('bot', err.error || `Something went wrong (${res.status}). Try again or call us at ${SHOP.phoneFmt} 📞`);
      return;
    }

    const data = await res.json();

    if (data.sessionId) sessionId = data.sessionId;

    const rawReply = data.reply || '';
    const showForm = rawReply.includes(BOOKING_TRIGGER);
    const displayReply = stripBookingTrigger(rawReply);

    addMessage('bot', displayReply, false);
    if (showForm) renderBookingForm();

  } catch (networkErr) {
    hideTyping();
    console.error('Network error:', networkErr);
    addMessage('bot',
      `I'm having trouble connecting right now. Please call us directly at <strong>${SHOP.phoneFmt}</strong> and we'll sort you out! 📞`,
    );
    addQuickReplies(['Call now ☎️', 'Try again 🔄']);
  } finally {
    isTyping = false;
    $sendBtn.disabled = false;
    $input.focus();
  }
}

async function init() {
  try {
    const res  = await fetch(`${API_BASE}/api/session/new`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ deviceHint: clientDeviceHint() }),
    });
    const data = await res.json();
    sessionId  = data.sessionId;
  } catch {
    sessionId = crypto.randomUUID?.() || Math.random().toString(36).slice(2);
  }

  setTimeout(() => {
    addMessage('bot',
      `Hey there! 👋 Welcome to <strong>Barbería Cullera</strong>. I'm here at reception — I can sort out an appointment, walk you through prices, or answer anything about the shop. What can I help you with today? ✂️`
    );
    addQuickReplies([
      { label: 'Book an appointment 📅', message: "I'd like to book an appointment" },
      'See services & prices 💈',
      'Opening hours 🕐',
      'Find us 📍',
    ]);
  }, 700);
}

$sendBtn.addEventListener('click', () => sendMessage($input.value));

$input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage($input.value);
  }
});

$input.addEventListener('input', () => {
  $input.style.height = 'auto';
  $input.style.height = Math.min($input.scrollHeight, 110) + 'px';
});

init();
</script>
