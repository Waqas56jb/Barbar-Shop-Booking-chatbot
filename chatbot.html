<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Cullera Barbershop — Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
/* ── Tokens ────────────────────────────────── */
:root{
  --bg:        #080808;
  --surface:   #101010;
  --card:      #181818;
  --card2:     #1e1e1e;
  --border:    #282828;
  --gold:      #c9a84c;
  --gold2:     #dfc06a;
  --gold-glow: rgba(201,168,76,.18);
  --text:      #ede8df;
  --text2:     #a09a8e;
  --text3:     #555050;
  --bot-bg:    #1c1c1c;
  --user-bg:   #c9a84c;
  --user-txt:  #0a0a0a;
  --green:     #3fb950;
  --radius:    20px;
  --font:      "DM Sans",system-ui,sans-serif;
  --serif:     "Cormorant Garamond",Georgia,serif;
  --safe-b:    env(safe-area-inset-bottom,0px);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

html,body{
  height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}

/* ── Shell ─────────────────────────────────── */
.shell{
  display:flex;
  flex-direction:column;
  height:100dvh;
  max-width:480px;
  margin:0 auto;
  background:var(--surface);
  border-left:1px solid var(--border);
  border-right:1px solid var(--border);
}

/* ── Header ────────────────────────────────── */
.header{
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 16px;
  height:66px;
  min-height:66px;
  background:var(--card);
  border-bottom:1px solid var(--border);
  flex-shrink:0;
  position:relative;
  z-index:5;
}
.h-avatar{
  width:42px;height:42px;border-radius:50%;
  background:linear-gradient(145deg,#c9a84c 0%,#7a5418 100%);
  display:flex;align-items:center;justify-content:center;
  font-size:20px;flex-shrink:0;
  box-shadow:0 0 0 2px var(--bg),0 0 0 4px rgba(201,168,76,.5);
}
.h-info{flex:1;min-width:0}
.h-name{
  font-family:var(--serif);
  font-size:1.1rem;font-weight:700;
  color:var(--text);line-height:1.2;
  letter-spacing:.01em;
}
.h-status{
  display:flex;align-items:center;gap:5px;
  font-size:.7rem;color:var(--text2);margin-top:2px;
}
.dot{
  width:7px;height:7px;border-radius:50%;
  background:var(--green);
  box-shadow:0 0 7px rgba(63,185,80,.7);
  animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

.h-call{
  width:38px;height:38px;border-radius:50%;
  background:var(--gold-glow);
  border:1px solid rgba(201,168,76,.3);
  display:flex;align-items:center;justify-content:center;
  font-size:17px;text-decoration:none;
  transition:background .18s;flex-shrink:0;
}
.h-call:hover{background:rgba(201,168,76,.25)}

/* ── Messages ───────────────────────────────── */
.msgs{
  flex:1;overflow-y:auto;
  padding:18px 14px 10px;
  display:flex;flex-direction:column;gap:4px;
  scroll-behavior:smooth;
  -webkit-overflow-scrolling:touch;
}
.msgs::-webkit-scrollbar{width:3px}
.msgs::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* ── Date label ────────────────────────────── */
.date-sep{
  display:flex;align-items:center;gap:8px;
  color:var(--text3);font-size:.66rem;
  padding:2px 0 10px;align-self:stretch;
}
.date-sep::before,.date-sep::after{content:'';flex:1;height:1px;background:var(--border)}

/* ── Row ────────────────────────────────────── */
.row{display:flex;align-items:flex-end;gap:8px;animation:fadeUp .22s ease both}
.row.bot{align-self:flex-start;max-width:88%}
.row.usr{align-self:flex-end;flex-direction:row-reverse;max-width:72%}
@keyframes fadeUp{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

.av{
  width:30px;height:30px;border-radius:50%;
  background:linear-gradient(145deg,#c9a84c,#7a5418);
  display:flex;align-items:center;justify-content:center;
  font-size:13px;flex-shrink:0;margin-bottom:2px;
}

.bub{
  padding:11px 15px;
  border-radius:var(--radius);
  font-size:.88rem;line-height:1.55;
  word-break:break-word;
}
.row.bot .bub{
  background:var(--bot-bg);
  color:var(--text);
  border-bottom-left-radius:5px;
  border:1px solid var(--border);
}
.row.usr .bub{
  background:var(--user-bg);
  color:var(--user-txt);
  border-bottom-right-radius:5px;
  font-weight:500;
}
.ts{font-size:.63rem;color:var(--text3);padding:0 2px;margin-top:1px}
.row.usr .ts{text-align:right}

/* ── Price table inside bubble ─────────────── */
.price-list{
  list-style:none;margin-top:6px;
  display:flex;flex-direction:column;gap:5px;
}
.price-list li{
  display:flex;justify-content:space-between;align-items:center;
  padding:7px 11px;gap:6px;
  background:rgba(255,255,255,.04);
  border:1px solid var(--border);
  border-radius:10px;font-size:.8rem;
}
.sn{color:var(--text);flex:1;min-width:0}
.st{color:var(--text2);font-size:.72rem;white-space:nowrap;flex-shrink:0}
.sp{color:var(--gold);font-weight:600;white-space:nowrap;flex-shrink:0}
.price-section-hd{
  color:var(--text2);font-size:.66rem;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;
  margin:13px 0 5px;padding-left:3px;
}

/* ── Typing indicator ───────────────────────── */
.typing-row{
  display:flex;align-items:flex-end;gap:8px;
  animation:fadeUp .2s ease both;
}
.typing-bub{
  background:var(--bot-bg);
  border:1px solid var(--border);
  border-radius:var(--radius);border-bottom-left-radius:5px;
  padding:13px 17px;
  display:flex;gap:5px;align-items:center;
}
.typing-bub span{
  width:6px;height:6px;border-radius:50%;
  background:var(--text3);
  animation:blink 1.2s infinite;
}
.typing-bub span:nth-child(2){animation-delay:.2s}
.typing-bub span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}

/* ── Actions area ───────────────────────────── */
.actions{
  padding:10px 14px max(calc(var(--safe-b) + 10px),14px);
  flex-shrink:0;
  background:var(--surface);
  border-top:1px solid var(--border);
}

/* 2×2 main menu */
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}

.menu-btn{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:15px;
  color:var(--text);
  font-family:var(--font);
  font-size:.83rem;font-weight:500;
  padding:14px 10px;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:7px;
  transition:background .16s,border-color .16s,transform .1s;
  touch-action:manipulation;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
  min-height:56px;
}
.menu-btn:hover{background:var(--gold-glow);border-color:rgba(201,168,76,.45)}
.menu-btn:active{transform:scale(.96)}
.menu-btn .mi{font-size:1.15rem}

/* Response buttons (book + back) */
.resp-btns{
  display:flex;flex-direction:column;gap:8px;
  animation:fadeUp .22s ease both;
}

.book-btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  background:var(--gold);
  color:#0a0a0a;
  font-family:var(--font);
  font-size:.86rem;font-weight:700;
  padding:14px 22px;
  border:none;border-radius:30px;
  cursor:pointer;text-decoration:none;
  transition:filter .16s,transform .1s;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
  box-shadow:0 4px 22px rgba(201,168,76,.32);
  width:100%;
}
.book-btn:hover{filter:brightness(1.1)}
.book-btn:active{transform:scale(.97)}

.back-btn{
  display:flex;align-items:center;justify-content:center;gap:6px;
  background:transparent;
  border:1px solid var(--border);
  border-radius:30px;
  color:var(--text2);
  font-family:var(--font);
  font-size:.78rem;font-weight:500;
  padding:11px 20px;
  cursor:pointer;
  transition:border-color .16s,color .16s;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
  width:100%;
}
.back-btn:hover{border-color:var(--text2);color:var(--text)}

/* ── Footer ────────────────────────────────── */
.footer{
  text-align:center;
  padding:7px 12px max(calc(var(--safe-b) + 6px),8px);
  font-size:.63rem;color:var(--text3);
  border-top:1px solid var(--border);
  background:var(--card);
  flex-shrink:0;
  line-height:1.5;
}
.footer a{color:var(--text3);text-decoration:none}
.footer a:hover{color:var(--text2)}

/* ── Desktop card ───────────────────────────── */
@media(min-width:500px){
  body{overflow:auto;background:#040404}
  .shell{
    border-radius:26px;
    box-shadow:0 24px 80px rgba(0,0,0,.7);
    margin:24px auto;
    height:calc(100dvh - 48px);
    max-height:840px;
  }
}
@media(max-width:340px){
  .menu-grid{grid-template-columns:1fr}
  .bub{font-size:.83rem}
}
</style>
</head>
<body>
<div class="shell">

  <!-- Header -->
  <div class="header">
    <div class="h-avatar" style="padding:0;overflow:hidden;background:none;">
      <img src="admin/logo.png" alt="Cullera Barbershop"
        style="width:100%;height:100%;object-fit:cover;border-radius:50%;"
        onerror="this.style.display='none';this.parentElement.style.background='linear-gradient(145deg,#c9a84c 0%,#7a5418 100%)';this.parentElement.style.fontSize='20px';this.parentElement.textContent='✂️'">
    </div>
    <div class="h-info">
      <div class="h-name">Cullera Barbershop</div>
      <div class="h-status"><div class="dot"></div><span>En línea ahora</span></div>
    </div>
    <a class="h-call" href="tel:617545837" title="Llamar">📞</a>
  </div>

  <!-- Messages -->
  <div class="msgs" id="msgs">
    <div class="date-sep">Hoy</div>
  </div>

  <!-- Actions -->
  <div class="actions" id="actions"></div>

  <!-- Footer -->
  <div class="footer">
    Carrer Ateneu Musical, 63a · Cullera, Valencia
    · <a href="tel:617545837">617 54 58 37</a>
  </div>

</div>
<script>
/* ══════════════════════════════════════════
   CONFIG — only change things here
══════════════════════════════════════════ */
const BOOK_URL = 'https://cut.yeasyapp.com/PjiP85';

/* Top 3 main services shown first */
const MAIN_SERVICES = [
  { name:'✂️ Corte',                              time:'30 min', price:'18.90€' },
  { name:'✂️🧔 Corte + barba simple',             time:'45 min', price:'24.90€' },
  { name:'✂️🧔 Corte + barba ritual + ozono',     time:'60 min', price:'29.00€' },
];

/* Full catalogue by category */
const ALL_SERVICES = {
  barba: [
    { name:'🧔 Barba simple',                     time:'15 min', price:'12.80€' },
    { name:'🧔 Barba con ritual + limpieza',       time:'30 min', price:'15.80€' },
  ],
  corte: [
    { name:'✂️ Degradado de laterales',           time:'15 min', price:'14.60€' },
    { name:'✂️ Rapado completo',                  time:'15 min', price:'15.80€' },
    { name:'✂️ Afeitado clásico de cabeza',       time:'15 min', price:'16.80€' },
  ],
  combinados: [
    { name:'Degradado laterales + barba simple',  time:'30 min', price:'22.90€' },
    { name:'Rapado completo + barba simple',       time:'30 min', price:'22.90€' },
    { name:'Afeitado cabeza + barba simple',       time:'30 min', price:'23.90€' },
    { name:'Degradado + barba ritual + ozono',     time:'30 min', price:'25.90€' },
    { name:'Rapado + barba ritual + limpieza',     time:'45 min', price:'25.90€' },
    { name:'Afeitado + barba tradicional + ozono', time:'45 min', price:'26.90€' },
  ],
  tratamientos: [
    { name:'💆 Tratamiento barba (canas)',         time:'20 min', price:'15.00€' },
    { name:'💆 Limpieza facial básica',            time:'15 min', price: '5.00€' },
    { name:'💆 Limpieza facial completa',          time:'25 min', price:'20.00€' },
    { name:'💆 Lavado intenso',                    time:'15 min', price: '8.00€' },
    { name:'💆 Calmar y equilibrar',               time:'15 min', price: '8.00€' },
    { name:'🔍 Análisis capilar',                  time:'15 min', price:'10.00€' },
  ],
  color: [
    { name:'🎨 Mechas',                            time:'120 min', price:'30.00€' },
    { name:'🎨 Color total',                       time:'180 min', price:'60.00€' },
    { name:'🌀 Permanente rizada',                 time:' 60 min', price:'40.00€' },
  ],
};

const MENU = [
  { icon:'✂️', label:'Servicios',         key:'servicios' },
  { icon:'💰', label:'Todos los precios', key:'precios'   },
  { icon:'🕐', label:'Horario',           key:'horario'   },
  { icon:'📲', label:'Reservar cita',     key:'reservar'  },
];

const RESPONSES = {
  servicios: {
    user: '✂️ Servicios',
    bot:  'Nuestros servicios más populares 💈',
    prices: 'main',
  },
  precios: {
    user: '💰 Todos los precios',
    bot:  'Lista completa de servicios y precios:',
    prices: 'all',
  },
  horario: {
    user: '🕐 Horario',
    bot:  '🕐 <strong>Horario de apertura:</strong><br><br>' +
          'Lunes: <em>Cerrado</em><br>' +
          'Martes: 09:00 – 21:00<br>' +
          'Miércoles: 09:00 – 21:00<br>' +
          'Jueves: 09:00 – 20:00<br>' +
          'Viernes: 08:00 – 20:00<br>' +
          'Sábado: 08:00 – 15:00<br>' +
          'Domingo: <em>Cerrado</em><br><br>' +
          '⚠️ <strong>Cancelaciones:</strong> mínimo 6 horas antes.<br>' +
          'No asistencia: se cobra el 100% del servicio.',
  },
  reservar: {
    user: '📲 Reservar cita',
    bot:  '¡Perfecto! Elige tu día y hora favoritos haciendo clic abajo. ✅<br><br>¡Te esperamos! 💈',
  },
};

/* ══════════════════════════════════════════
   HELPERS
══════════════════════════════════════════ */
const msgsEl   = document.getElementById('msgs');
const actionsEl= document.getElementById('actions');

function t(){
  return new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
}
function scroll(){
  msgsEl.scrollTo({top:msgsEl.scrollHeight,behavior:'smooth'});
}
function esc(s){
  return String(s||'')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\n/g,'<br>');
}

/* append a chat row */
function addRow(role, html){
  const row = document.createElement('div');
  row.className = 'row '+role;
  const now = t();
  if(role==='bot'){
    row.innerHTML = `
      <div class="av">✂️</div>
      <div style="display:flex;flex-direction:column;gap:1px">
        <div class="bub">${html}</div>
        <span class="ts">${now}</span>
      </div>`;
  } else {
    row.innerHTML = `
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:1px">
        <div class="bub">${html}</div>
        <span class="ts">${now}</span>
      </div>`;
  }
  msgsEl.appendChild(row);
  scroll();
}

/* typing indicator */
function showTyping(){
  const el = document.createElement('div');
  el.className='typing-row'; el.id='ty';
  el.innerHTML=`<div class="av">✂️</div><div class="typing-bub"><span></span><span></span><span></span></div>`;
  msgsEl.appendChild(el); scroll();
}
function hideTyping(){
  const el=document.getElementById('ty');
  if(el) el.remove();
}

/* build a single service row */
function svcRow(s){
  return `<li><span class="sn">${s.name}</span><span class="st">${s.time}</span><span class="sp">${s.price}</span></li>`;
}

/* build price list html — type: 'main' | 'all' */
function priceHtml(type){
  if(type==='main'){
    return `<ul class="price-list">${MAIN_SERVICES.map(svcRow).join('')}</ul>`;
  }
  const cats = [
    { title:'✂️ SERVICIOS PRINCIPALES', items: MAIN_SERVICES },
    { title:'🧔 BARBA',                 items: ALL_SERVICES.barba },
    { title:'✂️ CORTE / CABELLO',       items: ALL_SERVICES.corte },
    { title:'💈 COMBINADOS',            items: ALL_SERVICES.combinados },
    { title:'💆 TRATAMIENTOS',          items: ALL_SERVICES.tratamientos },
    { title:'🎨 COLOR Y ESTILO',        items: ALL_SERVICES.color },
  ];
  return cats.map(c=>
    `<div class="price-section-hd">${c.title}</div><ul class="price-list">${c.items.map(svcRow).join('')}</ul>`
  ).join('');
}

/* clear actions panel */
function clearActions(){actionsEl.innerHTML='';}

/* show booking + back buttons */
function showRespBtns(){
  clearActions();
  const wrap = document.createElement('div');
  wrap.className='resp-btns';

  const bk = document.createElement('a');
  bk.className='book-btn';
  bk.href=BOOK_URL;
  bk.target='_blank';
  bk.rel='noopener noreferrer';
  bk.innerHTML='📅 Reservar en cut.yeasyapp.com';

  const back = document.createElement('button');
  back.className='back-btn';
  back.innerHTML='🔙 Volver al menú';
  back.addEventListener('click', showMainMenu);

  wrap.appendChild(bk);
  wrap.appendChild(back);
  actionsEl.appendChild(wrap);
}

/* show 2×2 main menu */
function showMainMenu(){
  clearActions();
  const grid = document.createElement('div');
  grid.className='menu-grid';
  MENU.forEach(({icon,label,key})=>{
    const btn = document.createElement('button');
    btn.className='menu-btn';
    btn.innerHTML=`<span class="mi">${icon}</span><span>${label}</span>`;
    btn.addEventListener('click', ()=>handleTap(key));
    grid.appendChild(btn);
  });
  actionsEl.appendChild(grid);
}

/* handle menu tap */
function handleTap(key){
  clearActions();
  const r = RESPONSES[key];

  /* user bubble */
  addRow('usr', esc(r.user));

  /* if Reservar → open immediately then show bot + buttons */
  if(key==='reservar'){
    window.open(BOOK_URL,'_blank','noopener,noreferrer');
  }

  /* typing delay then bot reply */
  setTimeout(()=>{
    showTyping();
    setTimeout(()=>{
      hideTyping();
      const html = r.prices
        ? esc(r.bot) + priceHtml(r.prices)
        : r.bot;
      addRow('bot', html);
      showRespBtns();
    }, 950);
  }, 280);
}

/* ══════════════════════════════════════════
   BOOT
══════════════════════════════════════════ */
(function boot(){
  setTimeout(()=>{
    showTyping();
    setTimeout(()=>{
      hideTyping();
      addRow('bot',
        '✂️ ¡Hola! Bienvenido a <strong>Cullera Barbershop</strong>.<br><br>' +
        'Soy tu asistente virtual. Puedo informarte sobre nuestros servicios, precios y horarios.<br><br>' +
        'Para reservar tu cita, te redigiré a nuestro sistema de reservas.<br><br>' +
        '¿En qué te puedo ayudar? 👇'
      );
      showMainMenu();
    }, 1100);
  }, 500);
})();
</script>
</body>
</html>
