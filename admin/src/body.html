<div id="adminLoader" class="admin-loader is-hidden" aria-busy="false" aria-label="Loading admin data">
  <div class="admin-loader-inner">
    <div class="admin-loader-spin" aria-hidden="true"></div>
    <p class="admin-loader-title">Barbería Cullera</p>
    <p class="admin-loader-text" id="adminLoaderStatus">Loading dashboard data…</p>
    <div id="adminLoaderError" class="admin-loader-error" hidden></div>
    <button type="button" class="admin-loader-retry" id="adminLoaderRetry" hidden>Try again</button>
  </div>
</div>

<div id="adminAuthGate" class="admin-auth-gate">
  <div class="admin-auth-card">
    <div data-auth-view="login">
      <h1>Admin sign in</h1>
      <p class="admin-auth-sub">Barbería Cullera — dashboard access</p>
      <div id="authErrLogin" class="admin-auth-error" role="alert"></div>
      <form id="formAdminLogin">
        <div class="admin-auth-field">
          <label for="loginEmail">Email</label>
          <input id="loginEmail" name="email" type="email" autocomplete="username" required />
        </div>
        <div class="admin-auth-field">
          <label for="loginPassword">Password</label>
          <input id="loginPassword" name="password" type="password" autocomplete="current-password" required />
        </div>
        <div class="admin-auth-actions">
          <button type="submit">Sign in</button>
          <button type="button" class="admin-auth-link" id="btnShowReset">Forgot password?</button>
        </div>
      </form>
    </div>
    <div data-auth-view="reset-email" hidden>
      <button type="button" class="admin-auth-back" id="btnBackFromResetEmail">← Back to sign in</button>
      <h1>Reset password</h1>
      <p class="admin-auth-sub">Enter your admin email. If it exists, you can set a new password on the next step.</p>
      <div id="authErrResetEmail" class="admin-auth-error" role="alert"></div>
      <form id="formResetEmail">
        <div class="admin-auth-field">
          <label for="resetEmailStep1">Email</label>
          <input id="resetEmailStep1" type="email" autocomplete="email" required />
        </div>
        <div class="admin-auth-actions">
          <button type="submit">Continue</button>
        </div>
      </form>
    </div>
    <div data-auth-view="reset-pass" hidden>
      <button type="button" class="admin-auth-back" id="btnBackFromResetPass">← Back</button>
      <h1>New password</h1>
      <p class="admin-auth-sub" id="resetPassEmailHint"></p>
      <div id="authErrResetPass" class="admin-auth-error" role="alert"></div>
      <form id="formResetPass">
        <div class="admin-auth-field">
          <label for="resetNewPass">Password</label>
          <input id="resetNewPass" type="password" autocomplete="new-password" required minlength="8" />
        </div>
        <div class="admin-auth-field">
          <label for="resetNewPass2">Confirm password</label>
          <input id="resetNewPass2" type="password" autocomplete="new-password" required minlength="8" />
        </div>
        <div class="admin-auth-actions">
          <button type="submit">Update password</button>
        </div>
      </form>
    </div>
  </div>
</div>

<div id="adminAppRoot" class="admin-app-wrap is-hidden">
