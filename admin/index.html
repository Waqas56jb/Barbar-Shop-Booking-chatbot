<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Administración — Barbería Cullera</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* ═══════════════════════════════════════════
   DESIGN TOKENS
═══════════════════════════════════════════ */
:root {
  --bg:          #080808;
  --surface:     #101010;
  --card:        #161616;
  --card2:       #1d1d1d;
  --border:      #242424;
  --border2:     #2e2e2e;
  --gold:        #c9a84c;
  --gold2:       #dfc06a;
  --gold-dim:    #8a6820;
  --gold-glow:   rgba(201,168,76,.12);
  --gold-glow2:  rgba(201,168,76,.22);
  --text:        #e8e3d8;
  --text2:       #a09a8e;
  --text3:       #585248;
  --green:       #3fb950;
  --green-bg:    rgba(63,185,80,.1);
  --red:         #f85149;
  --red-bg:      rgba(248,81,73,.1);
  --blue:        #58a6ff;
  --blue-bg:     rgba(88,166,255,.1);
  --orange:      #e3a135;
  --orange-bg:   rgba(227,161,53,.1);
  --purple:      #bc8cff;
  --purple-bg:   rgba(188,140,255,.1);
  --sidebar-w:   240px;
  --header-h:    62px;
  --font-serif:  'Cormorant Garamond', Georgia, serif;
  --font-sans:   'Syne', system-ui, sans-serif;
  --radius:      14px;
  --radius-sm:   9px;
  --shadow:      0 4px 24px rgba(0,0,0,.5);
  --shadow-gold: 0 0 30px rgba(201,168,76,.08);
}

/* ═══════════════════════════════════════════
   RESET & BASE
═══════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%;scroll-behavior:smooth}
body{
  height:100%;min-height:100vh;
  min-height:100dvh;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-sans);
  font-size:14px;
  line-height:1.5;
  display:flex;
  overflow:hidden;
  overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
button{font-family:var(--font-sans);cursor:pointer}
input,select,textarea{font-family:var(--font-sans)}

/* ═══════════════════════════════════════════
   SIDEBAR
═══════════════════════════════════════════ */
.sidebar{
  width:var(--sidebar-w);
  min-width:var(--sidebar-w);
  height:100vh;
  height:100dvh;
  max-height:-webkit-fill-available;
  background:var(--surface);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  position:fixed;
  left:0;top:0;bottom:0;
  z-index:200;
  overflow:hidden;
  transition:transform .28s cubic-bezier(.4,0,.2,1),box-shadow .28s ease;
  will-change:transform;
}
.sidebar-backdrop{
  position:fixed;
  inset:0;
  z-index:150;
  background:rgba(0,0,0,.55);
  backdrop-filter:blur(2px);
  -webkit-backdrop-filter:blur(2px);
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  transition:opacity .25s ease,visibility .25s ease;
}
body.admin-sidebar-open .sidebar-backdrop{
  opacity:1;
  visibility:visible;
  pointer-events:auto;
}
.topbar-menu-btn{
  display:none;
  align-items:center;
  justify-content:center;
  width:40px;
  height:40px;
  flex-shrink:0;
  margin-right:4px;
  border-radius:var(--radius-sm);
  border:1px solid var(--border2);
  background:var(--card);
  color:var(--gold2);
  font-size:1.15rem;
  line-height:1;
  cursor:pointer;
  transition:border-color .15s,background .15s;
}
.topbar-menu-btn:hover{border-color:var(--gold-dim);background:var(--gold-glow)}
.topbar-menu-btn .menu-icon{
  display:block;
  width:20px;height:14px;
  position:relative;
}
.topbar-menu-btn .menu-icon::before,
.topbar-menu-btn .menu-icon::after{
  content:'';
  position:absolute;
  left:0;right:0;
  height:2px;
  background:currentColor;
  border-radius:1px;
}
.topbar-menu-btn .menu-icon::before{top:0}
.topbar-menu-btn .menu-icon::after{bottom:0}
.topbar-menu-btn .menu-icon span{
  position:absolute;
  left:0;right:0;
  top:6px;
  height:2px;
  background:currentColor;
  border-radius:1px;
  display:block;
}

.sidebar-logo{
  padding:22px 20px 16px;
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.logo-mark{
  display:flex;align-items:center;gap:10px;
}
.logo-icon{
  width:36px;height:36px;
  border-radius:10px;
  background:linear-gradient(135deg,var(--gold-dim),var(--gold));
  display:flex;align-items:center;justify-content:center;
  font-size:17px;
  flex-shrink:0;
}
.logo-text{
  font-family:var(--font-serif);
  font-size:1.18rem;
  font-weight:700;
  color:var(--gold2);
  line-height:1.15;
}
.logo-sub{
  font-size:.62rem;
  color:var(--text3);
  letter-spacing:.1em;
  text-transform:uppercase;
  margin-top:1px;
}

/* Sidebar nav */
.sidebar-nav{
  flex:1;
  overflow-y:auto;
  padding:12px 10px;
  display:flex;
  flex-direction:column;
  gap:2px;
}
.nav-section-label{
  font-size:.6rem;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--text3);
  padding:10px 10px 4px;
  font-weight:600;
}
.nav-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:9px 12px;
  border-radius:var(--radius-sm);
  color:var(--text2);
  cursor:pointer;
  transition:background .15s,color .15s;
  font-size:.82rem;
  font-weight:500;
  border:none;
  background:transparent;
  width:100%;
  text-align:left;
  position:relative;
}
.nav-item:hover{background:var(--card);color:var(--text)}
.nav-item.active{
  background:var(--gold-glow);
  color:var(--gold2);
  border:1px solid rgba(201,168,76,.18);
}
.nav-item .nav-icon{font-size:15px;width:18px;text-align:center;flex-shrink:0}
.nav-badge{
  margin-left:auto;
  background:var(--gold-glow2);
  color:var(--gold);
  font-size:.6rem;
  font-weight:700;
  padding:2px 7px;
  border-radius:20px;
  border:1px solid rgba(201,168,76,.25);
}
.nav-badge.red{background:var(--red-bg);color:var(--red);border-color:rgba(248,81,73,.25)}

/* Sidebar footer */
.sidebar-footer{
  padding:14px 10px;
  border-top:1px solid var(--border);
  flex-shrink:0;
}
.shop-status-pill{
  display:flex;align-items:center;gap:8px;
  background:var(--card);
  border:1px solid var(--border2);
  border-radius:var(--radius-sm);
  padding:9px 12px;
  font-size:.75rem;
}
.status-dot{
  width:8px;height:8px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 8px var(--green);
  flex-shrink:0;
  animation:pulse-status 2s ease-in-out infinite;
}
@keyframes pulse-status{
  0%,100%{box-shadow:0 0 4px var(--green)}
  50%{box-shadow:0 0 12px var(--green)}
}
.status-info{flex:1;min-width:0}
.status-label{color:var(--green);font-weight:600;font-size:.72rem}
.status-time{color:var(--text3);font-size:.65rem;margin-top:1px}

/* ═══════════════════════════════════════════
   MAIN LAYOUT
═══════════════════════════════════════════ */
.main{
  margin-left:var(--sidebar-w);
  flex:1;
  min-width:0;
  width:0;
  height:100vh;
  height:100dvh;
  max-height:-webkit-fill-available;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* Top header bar */
.topbar{
  min-height:var(--header-h);
  background:var(--surface);
  border-bottom:1px solid var(--border);
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  padding:0 24px;
  gap:14px;
  flex-shrink:0;
  position:relative;
  z-index:10;
  padding-left:max(16px,env(safe-area-inset-left));
  padding-right:max(16px,env(safe-area-inset-right));
}
.topbar-title{
  font-family:var(--font-serif);
  font-size:1.45rem;
  font-weight:700;
  color:var(--text);
  flex:1;
  min-width:0;
  line-height:1.2;
}
.topbar-title span{color:var(--gold)}
.topbar-actions{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:8px;
  min-width:0;
}

.admin-load-banner{
  margin:0 24px 12px;
  padding:10px 14px;
  border-radius:var(--radius-sm);
  font-size:.8rem;
  line-height:1.4;
  background:rgba(248,81,73,.1);
  border:1px solid rgba(248,81,73,.28);
  color:var(--text);
}

.date-filter{
  display:flex;
  background:var(--card);
  border:1px solid var(--border2);
  border-radius:var(--radius-sm);
  overflow:hidden;
}
.date-filter button{
  padding:6px 12px;
  background:transparent;
  border:none;
  color:var(--text2);
  font-size:.75rem;
  font-weight:500;
  transition:all .15s;
  font-family:var(--font-sans);
}
.date-filter button.active,
.date-filter button:hover{background:var(--gold-glow);color:var(--gold)}

.topbar-btn{
  display:flex;align-items:center;gap:6px;
  padding:7px 14px;
  border-radius:var(--radius-sm);
  border:1px solid var(--border2);
  background:var(--card);
  color:var(--text2);
  font-size:.75rem;
  font-weight:600;
  transition:all .18s;
  letter-spacing:.02em;
}
.topbar-btn:hover{border-color:var(--gold-dim);color:var(--gold)}
.topbar-btn.primary{
  background:linear-gradient(135deg,var(--gold-dim),var(--gold));
  color:#080808;
  border-color:transparent;
  font-weight:700;
}
.topbar-btn.primary:hover{opacity:.9}

.avatar-btn{
  width:34px;height:34px;
  border-radius:50%;
  background:linear-gradient(135deg,var(--gold-dim),var(--gold));
  display:flex;align-items:center;justify-content:center;
  font-size:14px;
  border:none;
  flex-shrink:0;
  cursor:pointer;
}

/* ═══════════════════════════════════════════
   PAGE CONTENT AREA
═══════════════════════════════════════════ */
.content{
  flex:1;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  padding:24px;
  padding-bottom:max(24px,env(safe-area-inset-bottom));
  display:none;/* pages hidden by default */
}
.content.active{display:block}

/* ═══════════════════════════════════════════
   STAT CARDS ROW
═══════════════════════════════════════════ */
.stat-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  margin-bottom:22px;
}
.stat-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:18px 20px;
  position:relative;
  overflow:hidden;
  transition:border-color .2s,box-shadow .2s;
  animation:fadeUp .4s ease both;
}
.stat-card:hover{
  border-color:var(--border2);
  box-shadow:var(--shadow-gold);
}
.stat-card::before{
  content:'';
  position:absolute;top:0;left:0;right:0;height:2px;
}
.stat-card.gold::before{background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.stat-card.green::before{background:linear-gradient(90deg,transparent,var(--green),transparent)}
.stat-card.blue::before{background:linear-gradient(90deg,transparent,var(--blue),transparent)}
.stat-card.purple::before{background:linear-gradient(90deg,transparent,var(--purple),transparent)}
.stat-card.orange::before{background:linear-gradient(90deg,transparent,var(--orange),transparent)}

.stat-label{
  font-size:.68rem;
  font-weight:600;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--text3);
  margin-bottom:8px;
}
.stat-value{
  font-family:var(--font-serif);
  font-size:2rem;
  font-weight:700;
  color:var(--text);
  line-height:1;
  margin-bottom:8px;
}
.stat-value span{font-size:1.1rem;color:var(--text2)}
.stat-change{
  display:inline-flex;align-items:center;gap:4px;
  font-size:.72rem;font-weight:600;
}
.stat-change.up{color:var(--green)}
.stat-change.down{color:var(--red)}
.stat-change-label{font-size:.68rem;color:var(--text3);margin-left:4px;font-weight:400}
.stat-icon{
  position:absolute;right:18px;top:18px;
  font-size:22px;opacity:.25;
}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:translateY(0)}
}

/* ═══════════════════════════════════════════
   SECTION HEADERS
═══════════════════════════════════════════ */
.section-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:14px;
}
.section-title{
  font-family:var(--font-serif);
  font-size:1.18rem;
  font-weight:700;
  color:var(--text);
}
.section-subtitle{font-size:.72rem;color:var(--text3);margin-top:2px}
.section-action{
  display:flex;align-items:center;gap:6px;
  font-size:.72rem;color:var(--gold);cursor:pointer;
  background:none;border:none;font-family:var(--font-sans);
  font-weight:600;
}
.section-action:hover{text-decoration:underline}

/* ═══════════════════════════════════════════
   CHART CARDS
═══════════════════════════════════════════ */
.chart-grid{
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:14px;
  margin-bottom:22px;
}
.chart-grid-3{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:14px;
  margin-bottom:22px;
}
.chart-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:20px;
  animation:fadeUp .5s ease both;
}
.chart-card .chart-header{
  display:flex;align-items:flex-start;justify-content:space-between;
  margin-bottom:16px;
}
.chart-title{font-weight:600;font-size:.88rem;color:var(--text)}
.chart-subtitle{font-size:.68rem;color:var(--text3);margin-top:2px}
.chart-value{
  font-family:var(--font-serif);
  font-size:1.6rem;font-weight:700;color:var(--gold2);
  text-align:right;
}
.chart-value-label{font-size:.65rem;color:var(--text3);text-align:right}
.chart-wrap{position:relative;height:200px}
.chart-wrap-sm{position:relative;height:160px}
.chart-wrap-lg{position:relative;height:260px}

/* Legend pills */
.chart-legend{
  display:flex;flex-wrap:wrap;gap:8px;
  margin-top:12px;
}
.legend-item{
  display:flex;align-items:center;gap:5px;
  font-size:.68rem;color:var(--text2);
}
.legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* ═══════════════════════════════════════════
   DATA TABLE
═══════════════════════════════════════════ */
.table-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  overflow-x:auto;
  overflow-y:visible;
  -webkit-overflow-scrolling:touch;
  margin-bottom:22px;
  animation:fadeUp .5s ease both;
  padding-left:clamp(8px,2vw,14px);
  padding-right:clamp(8px,2vw,14px);
  box-sizing:border-box;
}
.table-card table{min-width:720px}
.table-card table#leadsTable{min-width:920px}
@media (min-width:1100px){
  .table-card table{min-width:0}
  .table-card table#leadsTable{min-width:min(100%,960px)}
}
.table-toolbar{
  display:flex;align-items:center;gap:10px;
  padding:14px 18px;
  border-bottom:1px solid var(--border);
  margin-left:calc(-1 * clamp(8px,2vw,14px));
  margin-right:calc(-1 * clamp(8px,2vw,14px));
  padding-left:calc(18px + clamp(8px,2vw,14px));
  padding-right:calc(18px + clamp(8px,2vw,14px));
}
.table-search{
  flex:1;
  background:var(--card2);
  border:1px solid var(--border2);
  border-radius:var(--radius-sm);
  padding:7px 12px;
  color:var(--text);
  font-size:.8rem;
  outline:none;
  transition:border-color .2s;
}
.table-search:focus{border-color:var(--gold-dim)}
.table-search::placeholder{color:var(--text3)}
.table-filter-btn{
  padding:7px 12px;
  border-radius:var(--radius-sm);
  border:1px solid var(--border2);
  background:var(--card2);
  color:var(--text2);
  font-size:.75rem;
  font-weight:600;
  transition:all .15s;
  display:flex;align-items:center;gap:5px;
}
.table-filter-btn:hover{border-color:var(--gold-dim);color:var(--gold)}
.table-filter-btn.active{
  background:var(--gold-glow);color:var(--gold);
  border-color:rgba(201,168,76,.3);
}
table{width:100%;border-collapse:collapse}
th{
  padding:10px 18px;
  text-align:left;
  font-size:.65rem;
  font-weight:700;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--text3);
  border-bottom:1px solid var(--border);
  background:var(--surface);
  white-space:nowrap;
}
td{
  padding:12px 18px;
  font-size:.8rem;
  border-bottom:1px solid var(--border);
  color:var(--text);
  vertical-align:middle;
}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.015)}
.td-name{font-weight:600}
.td-service{
  display:inline-block;
  background:var(--gold-glow);
  border:1px solid rgba(201,168,76,.2);
  color:var(--gold);
  padding:2px 8px;
  border-radius:20px;
  font-size:.7rem;font-weight:600;
}
.td-amount{font-family:var(--font-serif);font-weight:700;color:var(--gold2)}
.status-pill{
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 9px;border-radius:20px;font-size:.68rem;font-weight:600;
}
.status-pill.confirmed{background:var(--green-bg);color:var(--green)}
.status-pill.pending{background:var(--orange-bg);color:var(--orange)}
.status-pill.cancelled{background:var(--red-bg);color:var(--red)}
.status-pill.completed{background:var(--blue-bg);color:var(--blue)}
.table-pagination{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 18px;
  border-top:1px solid var(--border);
  font-size:.72rem;color:var(--text3);
  margin-left:calc(-1 * clamp(8px,2vw,14px));
  margin-right:calc(-1 * clamp(8px,2vw,14px));
  padding-left:calc(18px + clamp(8px,2vw,14px));
  padding-right:calc(18px + clamp(8px,2vw,14px));
}
.page-btns{display:flex;gap:4px}
.page-btn{
  width:28px;height:28px;border-radius:6px;
  background:var(--card2);border:1px solid var(--border2);
  color:var(--text2);font-size:.72rem;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .15s;
}
.page-btn:hover,.page-btn.active{background:var(--gold-glow);color:var(--gold);border-color:rgba(201,168,76,.3)}

/* ═══════════════════════════════════════════
   MINI INSIGHT CARDS
═══════════════════════════════════════════ */
.insight-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  margin-bottom:22px;
}
.insight-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:16px 18px;
  display:flex;align-items:center;gap:14px;
  animation:fadeUp .45s ease both;
  transition:border-color .2s;
}
.insight-card:hover{border-color:var(--border2)}
.insight-icon{
  width:42px;height:42px;
  border-radius:11px;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;flex-shrink:0;
}
.insight-icon.gold{background:var(--gold-glow);border:1px solid rgba(201,168,76,.2)}
.insight-icon.green{background:var(--green-bg);border:1px solid rgba(63,185,80,.2)}
.insight-icon.blue{background:var(--blue-bg);border:1px solid rgba(88,166,255,.2)}
.insight-icon.red{background:var(--red-bg);border:1px solid rgba(248,81,73,.2)}
.insight-icon.purple{background:var(--purple-bg);border:1px solid rgba(188,140,255,.2)}
.insight-icon.orange{background:var(--orange-bg);border:1px solid rgba(227,161,53,.2)}
.insight-info{}
.insight-label{font-size:.67rem;color:var(--text3);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.insight-val{font-family:var(--font-serif);font-size:1.4rem;font-weight:700;color:var(--text);line-height:1.1;margin-top:2px}
.insight-sub{font-size:.67rem;color:var(--text3);margin-top:1px}

/* ═══════════════════════════════════════════
   ACTIVITY FEED
═══════════════════════════════════════════ */
.activity-list{display:flex;flex-direction:column;gap:0}
.activity-item{
  display:flex;align-items:flex-start;gap:12px;
  padding:12px 0;
  border-bottom:1px solid var(--border);
}
.activity-item:last-child{border-bottom:none}
.activity-dot{
  width:8px;height:8px;border-radius:50%;
  flex-shrink:0;margin-top:5px;
}
.activity-dot.gold{background:var(--gold)}
.activity-dot.green{background:var(--green)}
.activity-dot.blue{background:var(--blue)}
.activity-dot.red{background:var(--red)}
.activity-dot.purple{background:var(--purple)}
.activity-text{flex:1;font-size:.78rem;color:var(--text);line-height:1.4}
.activity-text strong{color:var(--text);font-weight:600}
.activity-time{font-size:.67rem;color:var(--text3);flex-shrink:0;margin-top:2px}

/* ═══════════════════════════════════════════
   HEATMAP GRID
═══════════════════════════════════════════ */
.heatmap-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:4px;
  margin-top:10px;
}
.heatmap-label-row{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:4px;
  margin-bottom:4px;
}
.heatmap-day-label{text-align:center;font-size:.6rem;color:var(--text3);font-weight:600}
.heatmap-cell{
  aspect-ratio:1;
  border-radius:4px;
  background:var(--card2);
  transition:transform .15s;
  cursor:default;
  position:relative;
}
.heatmap-cell:hover{transform:scale(1.15);z-index:1}
.heatmap-cell[data-level="0"]{background:#1a1a1a}
.heatmap-cell[data-level="1"]{background:rgba(201,168,76,.15)}
.heatmap-cell[data-level="2"]{background:rgba(201,168,76,.32)}
.heatmap-cell[data-level="3"]{background:rgba(201,168,76,.55)}
.heatmap-cell[data-level="4"]{background:rgba(201,168,76,.78)}
.heatmap-cell[data-level="5"]{background:var(--gold)}

/* ═══════════════════════════════════════════
   TOP SERVICES BARS
═══════════════════════════════════════════ */
.service-bar-list{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.service-bar-item{}
.service-bar-label{
  display:flex;justify-content:space-between;
  font-size:.75rem;color:var(--text);margin-bottom:5px;
  font-weight:500;
}
.service-bar-label span{color:var(--text2)}
.service-bar-track{
  height:6px;background:var(--card2);
  border-radius:6px;overflow:hidden;
}
.service-bar-fill{
  height:100%;border-radius:6px;
  background:linear-gradient(90deg,var(--gold-dim),var(--gold));
  transition:width .8s cubic-bezier(.16,1,.3,1);
}

/* ═══════════════════════════════════════════
   PROFILE / LEAD CARDS
═══════════════════════════════════════════ */
.lead-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
}
.lead-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:18px;
  animation:fadeUp .4s ease both;
  transition:border-color .2s,box-shadow .2s;
}
.lead-card:hover{border-color:var(--border2);box-shadow:var(--shadow)}
.lead-card-top{display:flex;align-items:center;gap:11px;margin-bottom:12px}
.lead-avatar{
  width:40px;height:40px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:700;color:#080808;
  flex-shrink:0;
  font-family:var(--font-serif);
}
.lead-name{font-weight:700;font-size:.9rem;color:var(--text)}
.lead-date{font-size:.67rem;color:var(--text3);margin-top:2px}
.lead-details{display:flex;flex-direction:column;gap:5px}
.lead-detail-row{
  display:flex;align-items:center;gap:7px;
  font-size:.75rem;color:var(--text2);
}
.lead-detail-icon{font-size:12px;flex-shrink:0;opacity:.6}
.lead-actions{
  display:flex;gap:6px;margin-top:13px;
}
.lead-action-btn{
  flex:1;padding:7px;border-radius:var(--radius-sm);
  border:1px solid var(--border2);
  background:var(--card2);color:var(--text2);
  font-size:.7rem;font-weight:600;
  transition:all .15s;text-align:center;
}
.lead-action-btn:hover{border-color:var(--gold-dim);color:var(--gold)}
.lead-action-btn.primary{
  background:var(--gold-glow);color:var(--gold);
  border-color:rgba(201,168,76,.3);
}

/* ═══════════════════════════════════════════
   APPOINTMENTS PAGE
═══════════════════════════════════════════ */
.appt-timeline{display:flex;flex-direction:column;gap:10px}
.appt-item{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:14px 18px;
  display:flex;align-items:center;gap:14px;
  transition:border-color .2s;
  animation:fadeUp .35s ease both;
}
.appt-item:hover{border-color:var(--border2)}
.appt-time-block{
  width:56px;text-align:center;flex-shrink:0;
}
.appt-time{font-family:var(--font-serif);font-size:1.05rem;font-weight:700;color:var(--gold2);line-height:1}
.appt-period{font-size:.65rem;color:var(--text3);margin-top:2px}
.appt-divider{width:1px;height:40px;background:var(--border2);flex-shrink:0}
.appt-info{flex:1;min-width:0}
.appt-name{font-weight:700;font-size:.88rem;color:var(--text)}
.appt-service{font-size:.73rem;color:var(--text2);margin-top:2px}
.appt-phone{font-size:.7rem;color:var(--text3);margin-top:1px}
.appt-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
.appt-price{font-family:var(--font-serif);font-weight:700;font-size:1rem;color:var(--gold)}
.appt-actions-row{
  display:flex;flex-wrap:wrap;gap:6px;align-items:center;
  justify-content:flex-start;min-width:0;
}
.appt-btn{
  padding:5px 10px;border-radius:6px;
  border:1px solid var(--border2);
  background:var(--card2);color:var(--text2);
  font-size:.68rem;font-weight:600;
  transition:all .15s;
  flex:0 1 auto;white-space:nowrap;
}
.appt-btn:hover{border-color:var(--gold-dim);color:var(--gold)}
.appt-btn.appt-btn-done{border-color:rgba(63,185,80,.35);color:var(--green)}
.appt-btn.appt-btn-done:hover{border-color:var(--green);color:#7ee787}
.appt-btn.appt-btn-danger{border-color:rgba(248,81,73,.35);color:var(--red)}
.appt-btn.appt-btn-danger:hover{border-color:var(--red);color:#ff8b87}
.leads-section-row td{
  padding:12px 14px 8px!important;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  font-size:.72rem;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:var(--text3);
}
.leads-section-row strong{color:var(--gold2);font-weight:700}
.leads-hint{text-transform:none;letter-spacing:0;font-weight:400;color:var(--text3);font-size:.68rem;margin-left:10px}
.appt-btn.danger:hover{border-color:var(--red);color:var(--red)}
.admin-inline-select{
  background:var(--bg2);color:var(--text);border:1px solid rgba(255,255,255,.12);
  border-radius:6px;padding:4px 8px;font-size:.75rem;max-width:min(140px,100%);cursor:pointer;
}
#leadsTable th:last-child,
#leadsTable td:last-child{
  position:relative;
  min-width:13rem;
  width:1%;
  max-width:22rem;
  box-sizing:border-box;
  padding-right:clamp(18px,4vw,36px)!important;
  padding-left:12px;
  vertical-align:top;
}
#leadsTable td:last-child .appt-actions-row{
  padding:4px 0 6px;
  max-width:100%;
}
@media (max-width:900px){
  #leadsTable td:last-child .appt-actions-row{
    flex-direction:column;
    align-items:stretch;
    max-width:11rem;
  }
  #leadsTable td:last-child .appt-btn{
    width:100%;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    text-align:center;
  }
}
.admin-inline-select:focus{outline:1px solid var(--gold-dim)}

/* ═══════════════════════════════════════════
   SETTINGS PAGE
═══════════════════════════════════════════ */
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.settings-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:20px;
}
.settings-title{font-weight:700;font-size:.9rem;color:var(--text);margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.settings-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:9px 0;border-bottom:1px solid var(--border);
}
.settings-row:last-child{border-bottom:none}
.settings-label{font-size:.8rem;color:var(--text)}
.settings-sub{font-size:.68rem;color:var(--text3);margin-top:1px}
.toggle{
  width:38px;height:22px;border-radius:11px;
  background:var(--border2);border:none;
  position:relative;cursor:pointer;transition:background .2s;
  flex-shrink:0;
}
.toggle.on{background:var(--green)}
.toggle::after{
  content:'';position:absolute;
  width:16px;height:16px;border-radius:50%;
  background:#fff;top:3px;left:3px;
  transition:left .2s;
}
.toggle.on::after{left:19px}
.settings-input{
  background:var(--card2);border:1px solid var(--border2);
  border-radius:6px;padding:6px 10px;
  color:var(--text);font-size:.8rem;outline:none;width:120px;
}
.settings-input:focus{border-color:var(--gold-dim)}

/* ═══════════════════════════════════════════
   UTILITIES
═══════════════════════════════════════════ */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:22px}
.full-col{margin-bottom:22px}
.mb-0{margin-bottom:0}
.tag-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tag{
  padding:2px 8px;border-radius:20px;
  font-size:.67rem;font-weight:600;
  background:var(--card2);border:1px solid var(--border2);color:var(--text2);
}
.divider{height:1px;background:var(--border);margin:20px 0}

.admin-app-wrap{
  display:flex;
  flex:1;
  width:100%;
  min-height:100vh;
  overflow:hidden;
  min-width:0;
}
.admin-app-wrap.is-hidden{display:none!important}

.admin-auth-gate{
  position:fixed;
  inset:0;
  z-index:9998;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--bg);
  padding:24px;
}
.admin-auth-gate.is-hidden{display:none!important}

.admin-auth-card{
  width:100%;
  max-width:400px;
  background:var(--card);
  border:1px solid var(--border2);
  border-radius:var(--radius);
  padding:28px 26px;
  box-shadow:var(--shadow-gold);
}
.admin-auth-card h1{
  font-family:var(--font-serif);
  font-size:1.35rem;
  color:var(--gold2);
  margin:0 0 6px;
  font-weight:700;
}
.admin-auth-sub{
  font-size:.8rem;
  color:var(--text3);
  margin:0 0 22px;
  line-height:1.45;
}
.admin-auth-field{margin-bottom:16px}
.admin-auth-field label{
  display:block;
  font-size:.72rem;
  text-transform:uppercase;
  letter-spacing:.08em;
  color:var(--text3);
  margin-bottom:6px;
  font-weight:600;
}
.admin-auth-field input{
  width:100%;
  padding:11px 12px;
  border-radius:var(--radius-sm);
  border:1px solid var(--border2);
  background:var(--surface);
  color:var(--text);
  font-size:.9rem;
  outline:none;
}
.admin-auth-field input:focus{border-color:var(--gold-dim)}
.admin-auth-error{
  font-size:.82rem;
  color:var(--red);
  margin:-8px 0 14px;
  line-height:1.4;
}
.admin-auth-error:empty{display:none}
.admin-auth-actions{
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-top:8px;
}
.admin-auth-actions button[type="submit"]{
  width:100%;
  padding:12px;
  border-radius:var(--radius-sm);
  border:none;
  background:linear-gradient(135deg,var(--gold-dim),var(--gold));
  color:#0a0a0a;
  font-weight:700;
  font-size:.88rem;
}
.admin-auth-actions button[type="submit"]:hover{filter:brightness(1.05)}
.admin-auth-link{
  background:none;
  border:none;
  color:var(--gold);
  font-size:.8rem;
  text-decoration:underline;
  cursor:pointer;
  padding:4px 0;
  text-align:center;
  font-family:inherit;
}
.admin-auth-back{
  background:none;
  border:none;
  color:var(--text2);
  font-size:.78rem;
  cursor:pointer;
  margin-bottom:12px;
  padding:0;
  font-family:inherit;
}
.admin-auth-back:hover{color:var(--text)}
.sidebar-signout{
  margin-top:10px;
  width:100%;
  padding:8px 10px;
  border-radius:var(--radius-sm);
  border:1px solid var(--border2);
  background:transparent;
  color:var(--text2);
  font-size:.72rem;
  font-weight:600;
  font-family:inherit;
}
.sidebar-signout:hover{border-color:var(--gold-dim);color:var(--gold)}

/* Full-screen boot loader (until /api/admin/overview succeeds) */
.admin-loader{
  position:fixed;inset:0;z-index:10000;
  display:flex;align-items:center;justify-content:center;
  background:var(--bg);
  transition:opacity .4s ease,visibility .4s ease;
}
.admin-loader.is-hidden{
  opacity:0;visibility:hidden;pointer-events:none;
}
.admin-loader-inner{text-align:center;max-width:360px;padding:24px}
.admin-loader-spin{
  width:52px;height:52px;margin:0 auto 20px;
  border:3px solid var(--border);border-top-color:var(--gold);
  border-radius:50%;
  animation:adminLoaderSpin .85s linear infinite;
}
@keyframes adminLoaderSpin{to{transform:rotate(360deg)}}
.admin-loader-title{
  font-family:var(--font-serif);font-size:1.35rem;font-weight:700;color:var(--text);margin:0 0 8px;
}
.admin-loader-text{font-size:.88rem;color:var(--text2);margin:0}
.admin-loader-error{
  margin-top:18px;padding:12px 14px;border-radius:var(--radius-sm);
  background:rgba(248,81,73,.1);border:1px solid rgba(248,81,73,.28);
  font-size:.8rem;color:var(--text);line-height:1.45;text-align:left;
}
.admin-loader-error[hidden]{display:none!important}
.admin-loader-retry{
  margin-top:16px;padding:10px 22px;border-radius:var(--radius-sm);
  background:var(--gold);color:#0a0a0a;border:none;font-weight:600;font-family:inherit;font-size:.82rem;cursor:pointer;
}
.admin-loader-retry:hover{filter:brightness(1.08)}
.admin-loader-retry[hidden]{display:none!important}

/* ═══════════════════════════════════════════
   RESPONSIVE — tablet, móvil, escritorio
═══════════════════════════════════════════ */
@media (max-width:1280px){
  .stat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .insight-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .lead-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .two-col{grid-template-columns:1fr}
  .settings-grid{grid-template-columns:1fr}
  div.chart-grid{grid-template-columns:1fr!important}
}
@media (max-width:1023px){
  body.admin-sidebar-open{
    overflow:hidden;
    touch-action:none;
  }
  .topbar-menu-btn{display:flex}
  .sidebar{
    width:min(280px,88vw);
    min-width:min(280px,88vw);
    transform:translateX(-100%);
    box-shadow:none;
  }
  body.admin-sidebar-open .sidebar{
    transform:translateX(0);
    box-shadow:8px 0 32px rgba(0,0,0,.45);
  }
  .sidebar-nav{
    padding-bottom:max(20px,env(safe-area-inset-bottom));
  }
  .sidebar-footer{
    padding-bottom:max(14px,env(safe-area-inset-bottom));
  }
  .main{
    margin-left:0;
    width:100%;
  }
  .topbar{
    gap:10px;
    padding-top:10px;
    padding-bottom:10px;
  }
  .topbar-title{
    font-size:1.22rem;
    flex:1 1 auto;
    min-width:120px;
  }
  .topbar-actions{
    flex:1 1 100%;
    justify-content:flex-start;
    row-gap:8px;
  }
  .date-filter{flex:1 1 auto;min-width:0;overflow-x:auto;-webkit-overflow-scrolling:touch;flex-wrap:nowrap}
  .date-filter button{flex:0 0 auto;touch-action:manipulation;min-height:40px;padding:8px 14px}
  .topbar-btn{min-height:40px;touch-action:manipulation}
  .avatar-btn{width:40px;height:40px;touch-action:manipulation}
  .chart-wrap{height:min(220px,45vw)}
  .chart-wrap-sm{height:150px}
  .chart-wrap-lg{height:220px}
  .content{padding:16px 14px}
  .admin-load-banner{margin-left:14px;margin-right:14px}
  .stat-grid{gap:12px}
  .stat-value{font-size:1.65rem}
}
@media (max-width:767px){
  body{font-size:13px}
  .stat-grid{grid-template-columns:1fr}
  .insight-grid{grid-template-columns:1fr}
  .lead-grid{grid-template-columns:1fr}
  .topbar-title{font-size:1.05rem}
  .stat-card{padding:14px 16px}
  .chart-card{padding:14px}
  .chart-header{flex-direction:column;align-items:flex-start;gap:8px}
  .chart-value{text-align:left}
  .chart-value-label{text-align:left}
  .table-toolbar{flex-wrap:wrap;align-items:stretch}
  .table-search{min-width:0;width:100%;flex:1 1 100%;min-height:44px}
  .table-filter-btn{min-height:40px;touch-action:manipulation}
  .table-card table{min-width:640px}
  .table-card table#leadsTable{min-width:720px}
  th,td{padding:10px 12px}
  .section-header{flex-direction:column;align-items:flex-start;gap:8px}
  .heatmap-day-label{font-size:.55rem}
  .heatmap-grid,.heatmap-label-row{gap:3px}
  .appt-item{flex-wrap:wrap;gap:10px}
  .appt-right{width:100%;justify-content:space-between}
  .table-pagination{flex-direction:column;gap:10px;align-items:flex-start}
}
@media (max-width:479px){
  .logo-text{font-size:1.05rem}
  .sidebar-logo{padding:16px 14px 12px}
  .sidebar-nav{padding:8px}
  .nav-item{padding:11px 12px;font-size:.85rem;min-height:44px}
  .date-filter button{padding:8px 10px;font-size:.7rem}
  .topbar-btn{padding:8px 10px;font-size:.68rem}
  .stat-change-label{display:block;margin-left:0;margin-top:4px}
}
@media (min-width:1024px){
  body.admin-sidebar-open .sidebar{transform:none;box-shadow:none}
  body.admin-sidebar-open .sidebar-backdrop{opacity:0;visibility:hidden;pointer-events:none}
}
</head>
<body>

<div id="adminLoader" class="admin-loader is-hidden" aria-busy="false" aria-label="Cargando datos de administración">
  <div class="admin-loader-inner">
    <div class="admin-loader-spin" aria-hidden="true"></div>
    <p class="admin-loader-title">Barbería Cullera</p>
    <p class="admin-loader-text" id="adminLoaderStatus">Cargando datos del panel…</p>
    <div id="adminLoaderError" class="admin-loader-error" hidden></div>
    <button type="button" class="admin-loader-retry" id="adminLoaderRetry" hidden>Reintentar</button>
  </div>
</div>

<div id="adminAuthGate" class="admin-auth-gate">
  <div class="admin-auth-card">
    <div data-auth-view="login">
      <h1>Acceso de administración</h1>
      <p class="admin-auth-sub">Barbería Cullera — acceso al panel</p>
      <div id="authErrLogin" class="admin-auth-error" role="alert"></div>
      <form id="formAdminLogin">
        <div class="admin-auth-field">
          <label for="loginEmail">Correo electrónico</label>
          <input id="loginEmail" name="email" type="email" autocomplete="username" required />
        </div>
        <div class="admin-auth-field">
          <label for="loginPassword">Contraseña</label>
          <input id="loginPassword" name="password" type="password" autocomplete="current-password" required />
        </div>
        <div class="admin-auth-actions">
          <button type="submit">Entrar</button>
          <button type="button" class="admin-auth-link" id="btnShowReset">¿Has olvidado la contraseña?</button>
        </div>
      </form>
    </div>
    <div data-auth-view="reset-email" hidden>
      <button type="button" class="admin-auth-back" id="btnBackFromResetEmail">← Volver al acceso</button>
      <h1>Restablecer contraseña</h1>
      <p class="admin-auth-sub">Escribe tu correo de administrador. Si existe, podrás crear una contraseña nueva en el siguiente paso.</p>
      <div id="authErrResetEmail" class="admin-auth-error" role="alert"></div>
      <form id="formResetEmail">
        <div class="admin-auth-field">
          <label for="resetEmailStep1">Correo electrónico</label>
          <input id="resetEmailStep1" type="email" autocomplete="email" required />
        </div>
        <div class="admin-auth-actions">
          <button type="submit">Continuar</button>
        </div>
      </form>
    </div>
    <div data-auth-view="reset-pass" hidden>
      <button type="button" class="admin-auth-back" id="btnBackFromResetPass">← Volver</button>

<script>
(function () {
  try {
    function jwtUsable(token) {
      try {
        var parts = String(token).split('.');
        if (parts.length !== 3) return false;
        var b = parts[1].replace(/-/g, '+').replace(/_/g, '/');
        while (b.length % 4) b += '=';
        var p = JSON.parse(atob(b));
        if (p.typ !== 'admin') return false;
        if (p.exp != null && Date.now() >= p.exp * 1000) return false;
        return true;
      } catch (e) { return false; }
    }
    var jwtRaw = (localStorage.getItem('barber_admin_jwt') || '').trim();
    var jwt = jwtUsable(jwtRaw) ? jwtRaw : '';
    var leg = (localStorage.getItem('barber_admin_token') || '').trim();
    var sp = new URLSearchParams(location.search);
    var urlTok = (sp.get('token') || sp.get('admin_token') || '').trim();
    if (!jwt && !leg && !urlTok) return;
    var gate = document.getElementById('adminAuthGate');
    var app = document.getElementById('adminAppRoot');
    var load = document.getElementById('adminLoader');
    if (gate) gate.classList.add('is-hidden');
    if (app) app.classList.remove('is-hidden');
    if (load) {
      load.classList.remove('is-hidden');
      load.setAttribute('aria-busy', 'true');
    }
  } catch (e) {}
})();
</script>

<script>
/* ═══════════════════════════════════════════

function grd(ctx, c1, c2, v=1){
  const g = ctx.createLinearGradient(0,0,0,v);
  g.addColorStop(0, c1); g.addColorStop(1, c2); return g;

/* ═══════════════════════════════════════════
   API + LIVE DATA (Neon / Vercel)
═══════════════════════════════════════════ */
const DAYS_SHORT = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
/** Matches PostgreSQL EXTRACT(DOW): 0=Sun … 6=Sat (used for dowRevenue / botPerf arrays from API). */
const DOW_LABELS_SUN0 = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const MONTHS     = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const LEAD_COLORS = ['#c9a84c','#3fb950','#58a6ff','#bc8cff','#e3a135','#f85149'];
const LS_ADMIN_TOKEN = 'barber_admin_token';
const LS_ADMIN_JWT = 'barber_admin_jwt';
let OVERVIEW = null;
const CHART_INSTANCES = {};
let resetFlowEmail = '';
let resetFlowToken = '';

function getUrlQueryToken() {
  try {
    const q = new URLSearchParams(location.search);
    return (q.get('token') || q.get('admin_token') || '').trim();
  } catch (_) {
    return '';
  }
}

function parseJwtPayload(tok) {
  try {
    const parts = String(tok || '').split('.');
    if (parts.length !== 3) return null;
    let b = parts[1].replace(/-/g, '+').replace(/_/g, '/');
    const pad = b.length % 4;
    if (pad) b += '='.repeat(4 - pad);
    return JSON.parse(atob(b));
  } catch (_) {
    return null;
  }
}

function isClientJwtUsable(tok) {
  const p = parseJwtPayload(tok);
  if (!p || p.typ !== 'admin') return false;
  if (p.exp != null && typeof p.exp === 'number' && Date.now() >= p.exp * 1000) return false;
  return true;
}

function scrubExpiredOrInvalidJwt() {
  let j = '';
  try { j = (localStorage.getItem(LS_ADMIN_JWT) || '').trim(); } catch (_) {}
  if (!j) return;
  if (!isClientJwtUsable(j)) {
    try { localStorage.removeItem(LS_ADMIN_JWT); } catch (_) {}
  }
}

function getAdminJwt() {
  try {
    const j = (localStorage.getItem(LS_ADMIN_JWT) || '').trim();
    if (j.split('.').length !== 3) return '';
    return isClientJwtUsable(j) ? j : '';
  } catch (_) { return ''; }
}

function tokenForQuery() {
  const u = getUrlQueryToken();
  if (u) return u;
  const j = getAdminJwt();
  if (j) return j;
  try { return (localStorage.getItem(LS_ADMIN_TOKEN) || '').trim(); } catch (_) { return ''; }
}

function getAdminToken() {
  return tokenForQuery();
}

function hasStoredOrUrlCredential() {
  if (getUrlQueryToken()) return true;
  if (getAdminJwt()) return true;
  try { return Boolean((localStorage.getItem(LS_ADMIN_TOKEN) || '').trim()); } catch (_) { return false; }
}

function apiBase() {
  var PRODUCTION_API = 'https://barbar-shop-booking-chatbot-tspg.vercel.app'.replace(/\/$/, '');
  try {
    var q = new URLSearchParams(location.search).get('api');
    if (q) return q.replace(/\/$/, '');
    var proto = location.protocol;
    var host = location.hostname || '';
    var isLocal =
      host === 'localhost' ||
      host === '127.0.0.1' ||
      host === '[::1]' ||
      (host.length > 0 && host.endsWith && host.endsWith('.local'));
    if (isLocal && (proto === 'http:' || proto === 'https:')) return '';
    if (proto !== 'http:' && proto !== 'https:') return 'http://localhost:3000';
    return PRODUCTION_API;
  } catch (_) {
    return 'http://localhost:3000';
  }
}

function normalizeEmailInput(raw) {
  let s = String(raw ?? '').trim().toLowerCase();
  try { s = s.normalize('NFKC'); } catch (_) {}
  return s.replace(/[\u200B-\u200D\uFEFF]/g, '');
}

function adminHeaders() {
  const h = { 'Content-Type': 'application/json', Accept: 'application/json' };
  const urlTok = getUrlQueryToken();
  const jwt = getAdminJwt();
  let legacy = '';
  try { legacy = (localStorage.getItem(LS_ADMIN_TOKEN) || '').trim(); } catch (_) {}
  if (urlTok) {
    if (urlTok.split('.').length === 3) h['Authorization'] = 'Bearer ' + urlTok;
    else h['x-admin-token'] = urlTok;
  } else if (jwt) {
    h['Authorization'] = 'Bearer ' + jwt;
  } else if (legacy) {
    h['x-admin-token'] = legacy;
  }
  return h;
}

async function adminFetch(path, opts = {}) {
  return fetch(`${apiBase()}${path}`, { ...opts, headers: { ...adminHeaders(), ...(opts.headers || {}) } });
}

function authShowView(name) {
  document.querySelectorAll('[data-auth-view]').forEach((el) => {
    el.hidden = el.getAttribute('data-auth-view') !== name;
  });
}

function clearAuthErrors() {
  ['authErrLogin', 'authErrResetEmail', 'authErrResetPass'].forEach((id) => {
    const el = document.getElementById(id);
    if (el) el.textContent = '';
  });
}

function setAuthGateError(id, msg) {
  const el = document.getElementById(id);
  if (el) el.textContent = msg || '';
}

function showAppHideGate() {
  const g = document.getElementById('adminAuthGate');
  const a = document.getElementById('adminAppRoot');
  if (g) g.classList.add('is-hidden');
  if (a) a.classList.remove('is-hidden');
}

function showGateHideApp() {
  const g = document.getElementById('adminAuthGate');
  const a = document.getElementById('adminAppRoot');
  if (g) g.classList.remove('is-hidden');
  if (a) a.classList.add('is-hidden');
  hideBootLoader();
}

function logoutToGate() {
  try {
    localStorage.removeItem(LS_ADMIN_JWT);
    localStorage.removeItem(LS_ADMIN_TOKEN);
  } catch (_) {}
  adminBootComplete = false;
  resetFlowEmail = '';
  resetFlowToken = '';
  try {
    const u = new URL(location.href);
    if (u.searchParams.has('token') || u.searchParams.has('admin_token')) {
      u.searchParams.delete('token');
      u.searchParams.delete('admin_token');
      history.replaceState({}, '', u.toString());
    }
  } catch (_) {}
  showGateHideApp();
  hideBootLoader();
  hideAdminLoadBanner();
  authShowView('login');
  clearAuthErrors();
}

async function tryEnterDashboard() {
  showAppHideGate();
  showBootLoader();
  adminBootComplete = false;
  await loadAdminData({ silent: false });
}

function wireAuthForms() {
  const loginForm = document.getElementById('formAdminLogin');
  const resetEmailForm = document.getElementById('formResetEmail');
  const resetPassForm = document.getElementById('formResetPass');
  const btnShowReset = document.getElementById('btnShowReset');
  const btnBackEmail = document.getElementById('btnBackFromResetEmail');
  const btnBackPass = document.getElementById('btnBackFromResetPass');
  const btnOut = document.getElementById('btnAdminSignOut');

  if (btnShowReset) {
    btnShowReset.addEventListener('click', () => {
      clearAuthErrors();
      authShowView('reset-email');
    });
  }
  if (btnBackEmail) {
    btnBackEmail.addEventListener('click', () => {
      clearAuthErrors();
      authShowView('login');
    });
  }
  if (btnBackPass) {
    btnBackPass.addEventListener('click', () => {
      clearAuthErrors();
      authShowView('reset-email');
    });
  }
  if (btnOut) {
    btnOut.addEventListener('click', () => logoutToGate());
  }

  if (loginForm && !loginForm.dataset.wired) {
    loginForm.dataset.wired = '1';
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearAuthErrors();
      const submitBtn = loginForm.querySelector('button[type="submit"]');
      const email = normalizeEmailInput(document.getElementById('loginEmail')?.value);
      const password = String(document.getElementById('loginPassword')?.value || '');
      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.dataset._label = submitBtn.textContent;
        submitBtn.textContent = 'Signing in…';
      }
      let r;
      try {
        r = await fetch(`${apiBase()}/api/admin/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
          body: JSON.stringify({ email, password }),
        });
      } catch (err) {
        setAuthGateError('authErrLogin', 'Network error. Check that the API is running and the URL (?api=) is correct.');
        return;
      } finally {
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.textContent = submitBtn.dataset._label || 'Entrar';
        }
      }
      let j = {};
      try { j = await r.json(); } catch (_) {}
      if (!r.ok) {
        setAuthGateError('authErrLogin', j.error || 'No se pudo iniciar sesión.');
        return;
      }
      if (!j.token) {
        setAuthGateError('authErrLogin', 'Server did not return a token.');
        return;
      }
      localStorage.setItem(LS_ADMIN_JWT, j.token);
      try { localStorage.removeItem(LS_ADMIN_TOKEN); } catch (_) {}
      try {
        const u = new URL(location.href);
        u.searchParams.delete('token');
        u.searchParams.delete('admin_token');
        history.replaceState({}, '', u.toString());
      } catch (_) {}
      await tryEnterDashboard();
    });
  }

  if (resetEmailForm && !resetEmailForm.dataset.wired) {
    resetEmailForm.dataset.wired = '1';
    resetEmailForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearAuthErrors();
      const email = normalizeEmailInput(document.getElementById('resetEmailStep1')?.value);
      const r = await fetch(`${apiBase()}/api/admin/auth/verify-reset-email`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        body: JSON.stringify({ email }),
      });
      let j = {};
      try { j = await r.json(); } catch (_) {}
      if (!r.ok) {
        let msg = 'Algo salió mal. Inténtalo de nuevo.';
        if (r.status === 404) {
          msg = 'No encontramos una cuenta con ese correo. Revisa la dirección e inténtalo de nuevo o vuelve al acceso.';
        } else if (r.status === 400) {
          msg = 'Introduce un correo electrónico válido.';
        } else if (r.status === 429) {
          msg = 'Demasiados intentos. Espera unos minutos e inténtalo de nuevo.';
        } else if (r.status === 503) {
          msg = 'Este servicio no está disponible temporalmente. Inténtalo más tarde.';
        }
        alert(msg);
        return;
      }
      resetFlowEmail = email;
      resetFlowToken = j.resetToken || '';
      if (!resetFlowToken) {
        alert('Algo salió mal. Inicia de nuevo el restablecimiento desde el acceso.');
        return;
      }
      const hint = document.getElementById('resetPassEmailHint');
      if (hint) hint.textContent = `Elige una contraseña nueva para ${email}.`;
      authShowView('reset-pass');
    });
  }

  if (resetPassForm && !resetPassForm.dataset.wired) {
    resetPassForm.dataset.wired = '1';
    resetPassForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearAuthErrors();
      const password = String(document.getElementById('resetNewPass')?.value || '');
      const passwordConfirm = String(document.getElementById('resetNewPass2')?.value || '');
      const r = await fetch(`${apiBase()}/api/admin/auth/reset-password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        body: JSON.stringify({
          email: resetFlowEmail,
          resetToken: resetFlowToken,
          password,
          passwordConfirm,
        }),
      });
      let j = {};
      try { j = await r.json(); } catch (_) {}
      if (!r.ok) {
        const err = j && j.error ? String(j.error) : '';
        const msg =
          err && err.length > 0 && err.length < 160
            ? err
            : 'No se pudo actualizar la contraseña. Inténtalo de nuevo o solicita un restablecimiento desde el acceso.';
        alert(msg);
        return;
      }
      resetFlowEmail = '';
      resetFlowToken = '';
      authShowView('login');
      alert('Tu contraseña se ha actualizado. Ya puedes entrar.');
    });
  }
}

async function bootstrapAdmin() {
  wireAuthForms();
  scrubExpiredOrInvalidJwt();
  if (hasStoredOrUrlCredential()) {
    await tryEnterDashboard();
    return;
  }
  showGateHideApp();
}
function destroyCharts() {
  Object.keys(CHART_INSTANCES).forEach((k) => { try { CHART_INSTANCES[k].destroy(); } catch (_) {} delete CHART_INSTANCES[k]; });
}
function padArr(arr, len, fill = 0) {
  const a = (arr || []).slice();
  while (a.length < len) a.push(fill);
  return a.slice(0, len);
}

  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

function wireResponsiveSidebar() {
  var toggle = document.getElementById('btnSidebarToggle');
  var backdrop = document.getElementById('sidebarBackdrop');
  if (toggle) {
    toggle.addEventListener('click', function () {
      if (!isMobileSidebarMode()) return;
      setSidebarOpen(!document.body.classList.contains('admin-sidebar-open'));
    });
  }
  if (backdrop) {
    backdrop.addEventListener('click', function () { setSidebarOpen(false); });
  }
  window.addEventListener('resize', function () {
    if (!isMobileSidebarMode()) setSidebarOpen(false);
  });
  window.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') setSidebarOpen(false);
  });
}

function setFilter(f, btn) {
  document.querySelectorAll('.date-filter button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function toggleFilter(btn) {
  btn.closest('.table-toolbar').querySelectorAll('.table-filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function filterTable(input, tableId) {
  const val = input.value.toLowerCase();
  document.querySelectorAll('#' + tableId + ' tbody tr').forEach(row => {
    row.style.display = row.textContent.toLowerCase().includes(val) ? '' : 'none';
  });
}

   BUILD TABLES

function statusPill(s) {
  const map = { confirmed:'confirmed', pending:'pending', completed:'completed', cancelled:'cancelled' };
  const labels = { confirmed:'● Confirmada', pending:'● Pendiente', completed:'✓ Completada', cancelled:'✕ Cancelada' };
  return `<span class="status-pill ${map[s]||'pending'}">${labels[s]||s}</span>`;
}

function mapApptStatus(st) {
  const x = String(st || 'pending').toLowerCase();
  if (x === 'completed') return 'completed';
  if (x === 'cancelled') return 'cancelled';
  if (x === 'confirmed') return 'confirmed';
  return 'pending';
}

function escapeCell(t) {
  const d = document.createElement('div');
  d.textContent = t == null ? '' : String(t);
  return d.innerHTML;
}

async function viewSessionMessages(sessionId) {
  const r = await adminFetch('/api/admin/sessions/' + encodeURIComponent(sessionId) + '/messages');
  if (!r.ok) { alert('No se pudieron cargar los mensajes'); return; }
  const j = await r.json();
  const txt = (j.messages || []).map(m => `${m.role}: ${m.content}`).join('\n\n---\n\n');
  alert(txt.slice(0, 8000) || 'Aún no hay mensajes guardados.');
}

function sessionDevice(s) {
  if (s.device_hint === 'mobile') return '📱 Móvil';
  if (s.device_hint === 'desktop') return '💻 Escritorio';
  const ua = (s.user_agent || '').toLowerCase();
  if (/mobile|android|iphone|ipad/i.test(ua)) return '📱 Móvil';
  return '💻 Escritorio';
}

function sessionVisitorLabel(s) {
  if (s.outcome === 'booked') return 'Con cita';
  if (s.outcome === 'engaged') return 'Prospecto';
  return 'Rebote';
}

function formatSessionDuration(started, ended) {
  const ms = new Date(ended) - new Date(started);
  if (!Number.isFinite(ms) || ms < 0) return '—';
  const m = Math.floor(ms / 60000);
  if (m < 60) return `${m}m`;
  return `${Math.floor(m / 60)}h ${m % 60}m`;
}

async function patchLeadRecord(leadId, body) {
  const r = await adminFetch(`/api/admin/leads/${encodeURIComponent(leadId)}`, {
    method: 'PATCH',
    body: JSON.stringify(body),
  });
  if (r.status === 401) {
    if (hasStoredOrUrlCredential()) {
      logoutToGate();
      setAuthGateError('authErrLogin', 'La sesión ha caducado. Vuelve a entrar.');
    } else {
      showAdminLoadBanner('La API de administración rechazó la solicitud. Entra de nuevo o usa <code>?token=…</code> con <code>ADMIN_TOKEN</code>.');
    }
    return;
  }
  if (!r.ok) {
    const t = await r.text();
    alert('No se pudo guardar: ' + t);
    return;
  }
  await loadAdminData();
}

async function deleteLeadRecord(leadId) {
  const id = Number(leadId);
  if (!Number.isFinite(id)) return;
  if (!confirm('¿Eliminar este prospecto permanentemente? Esta acción no se puede deshacer.')) return;
  const r = await adminFetch(`/api/admin/leads/${encodeURIComponent(id)}`, { method: 'DELETE' });
  if (r.status === 401) {
    if (hasStoredOrUrlCredential()) {
      logoutToGate();
      setAuthGateError('authErrLogin', 'La sesión ha caducado. Vuelve a entrar.');
    }
    return;
  }
  if (!r.ok) {
    const t = await r.text();
    alert('No se pudo eliminar: ' + t);
    return;
  }
  await loadAdminData();
}

function partitionLeadsForUi(rows) {
  const queue = [];
  const cancelled = [];
  const done = [];
  for (const l of rows || []) {
    const st = String(l.appointment_status || 'pending').toLowerCase();
    if (st === 'completed') done.push(l);
    else if (st === 'cancelled') cancelled.push(l);
    else queue.push(l);
  }
  return { queue, cancelled, done };
}

function leadRowHtml(l) {
  const cap = l.captured_at ? new Date(l.captured_at).toLocaleString('en-GB') : '—';
  const crm = String(l.crm_status || 'new').toLowerCase();
  const id = Number(l.id);
  const crmOpts = ['new', 'contacted', 'converted'];
  const crmSel = crmOpts.map((v) =>
    `<option value="${v}"${crm === v ? ' selected' : ''}>${v}</option>`,
  ).join('');
  const crmCell = Number.isFinite(id)
    ? `<select class="admin-inline-select" onchange="patchLeadRecord(${id},{crm_status:this.value})">${crmSel}</select>`
    : escapeCell(crm);
  const apptSt = mapApptStatus(l.appointment_status);
  const apptOpts = ['pending', 'confirmed', 'completed', 'cancelled'];
  const apptSel = apptOpts.map((v) =>
    `<option value="${v}"${apptSt === v ? ' selected' : ''}>${v}</option>`,
  ).join('');
  const bookingCell = Number.isFinite(id)
    ? `<select class="admin-inline-select" onchange="patchLeadRecord(${id},{appointment_status:this.value})">${apptSel}</select>`
    : escapeCell(String(l.appointment_status || '—'));
  const sid = String(l.session_id || '').replace(/'/g, "\\'");
  const canDone = Number.isFinite(id) && !['completed', 'cancelled'].includes(apptSt);
  const doneBtn = canDone
    ? `<button type="button" class="appt-btn appt-btn-done" title="Marcar servicio como completado" onclick="patchLeadRecord(${id},{appointment_status:'completed'})">Hecho</button>`
    : '';
  const delBtn = Number.isFinite(id)
    ? `<button type="button" class="appt-btn appt-btn-danger" title="Eliminar prospecto" onclick="deleteLeadRecord(${id})">Eliminar</button>`
    : '';
  return `
    <tr data-lead-id="${l.id}">
      <td class="td-name">${escapeCell(l.name)}</td>
      <td style="color:var(--text2)">${escapeCell(l.phone)}</td>
      <td><span class="td-service">${escapeCell(l.service)}</span></td>
      <td style="color:var(--text2);font-size:.75rem">${escapeCell(cap)}</td>
      <td style="text-align:center">${l.conversation_turns ?? 0}</td>
      <td>${crmCell}</td>
      <td>${bookingCell}</td>
      <td><div class="appt-actions-row">
        <button type="button" class="appt-btn" onclick="viewSessionMessages('${sid}')">Chat</button>
        ${doneBtn}
        ${delBtn}
      </div></td>
    </tr>`;
}

function buildApptTable() {
  const tbody = document.getElementById('apptBody');
  const rows = (OVERVIEW && OVERVIEW.appointments) ? OVERVIEW.appointments : [];
  const apptOpts = ['pending', 'confirmed', 'completed', 'cancelled'];
  tbody.innerHTML = rows.map((a) => {
    const st = mapApptStatus(a.appointment_status);
    const amt = a.amount_eur != null ? Number(a.amount_eur) : '—';
    const id = Number(a.id);
    const sel = apptOpts.map((v) =>
      `<option value="${v}"${st === v ? ' selected' : ''}>${v}</option>`,
    ).join('');
    const statusCell = Number.isFinite(id)
      ? `<select class="admin-inline-select" onchange="patchLeadRecord(${id},{appointment_status:this.value})">${sel}</select>`
      : escapeCell(String(a.appointment_status || '—'));
    return `
    <tr>
      <td class="td-name">${escapeCell(a.name)}</td>
      <td><span class="td-service">${escapeCell(a.service)}</span></td>
      <td>${escapeCell(a.preferred_date || '—')}</td>
      <td>${escapeCell(a.preferred_time || '—')}</td>
      <td style="color:var(--text2)">${escapeCell(a.phone)}</td>
      <td class="td-amount">${typeof amt === 'number' ? '€' + amt.toFixed(0) : amt}</td>
      <td>${statusCell}</td>
      <td>
        <div class="appt-actions-row">
          <button type="button" class="appt-btn" onclick="viewSessionMessages('${(a.session_id || '').replace(/'/g, "\\'")}')">Chat</button>
        </div>
      </td>
    </tr>`;
  }).join('') || '<tr><td colspan="8" style="padding:20px;color:var(--text3)">Aún no hay reservas — los datos se sincronizan desde el chat de clientes.</td></tr>';
}

function buildLeadsTable() {
  const qBody = document.getElementById('leadsQueueBody');
  const cBody = document.getElementById('leadsCancelledBody');
  const dBody = document.getElementById('leadsCompletedBody');
  if (!qBody || !cBody || !dBody) return;
  const rows = (OVERVIEW && OVERVIEW.leads) ? OVERVIEW.leads : [];
  const { queue, cancelled, done } = partitionLeadsForUi(rows);

  const section = (title, hint, list) => {
    const head = `<tr class="leads-section-row"><td colspan="8"><strong>${title}</strong><span class="leads-hint">${hint}</span></td></tr>`;
    if (!list.length) {
      return head + `<tr><td colspan="8" style="padding:16px;color:var(--text3)">Sin registros.</td></tr>`;
    }
    return head + list.map(leadRowHtml).join('');
  };

  qBody.innerHTML = section('En cola', 'Por orden de llegada — lo más antiguo arriba', queue);
  cBody.innerHTML = cancelled.length
    ? section('Canceladas', 'Por orden de captura', cancelled)
    : '';
  dBody.innerHTML = section('Completadas', 'Visitas finalizadas — primero lo más antiguo', done);
}

function buildLeadCards() {
  const container = document.getElementById('leadCards');
  const { queue, cancelled } = partitionLeadsForUi((OVERVIEW && OVERVIEW.leads) || []);
  const cards = [...queue, ...cancelled].slice(0, 6);
  container.innerHTML = cards.map((l, i) => {
    const initials = String(l.name || '?').split(' ').map((w) => w[0]).join('').slice(0, 2);

        <div><div class="lead-name">${escapeCell(l.name)}</div><div class="lead-date">${escapeCell(cap)}</div></div>
      </div>
      <div class="lead-details">
        <div class="lead-detail-row"><span class="lead-detail-icon">📞</span>${escapeCell(l.phone)}</div>
        <div class="lead-detail-row"><span class="lead-detail-icon">✂️</span>${escapeCell(l.service)}</div>
      <div class="lead-detail-row"><span class="lead-detail-icon">💬</span>${l.conversation_turns ?? 0} mensajes en la sesión</div>
      </div>
      <div class="lead-actions">
        <button type="button" class="lead-action-btn" onclick="viewSessionMessages('${(l.session_id || '').replace(/'/g, "\\'")}')">💬 Transcripción</button>
      </div>

function buildVisitorsTable() {
  const tbody = document.getElementById('visitorsBody');
  const rows = (OVERVIEW && OVERVIEW.sessions) ? OVERVIEW.sessions : [];
  tbody.innerHTML = rows.map((s) => {
    const shortId = (s.session_id || '').slice(0, 8) + '…';
    const started = s.started_at ? new Date(s.started_at).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }) : '—';
    const dur = formatSessionDuration(s.started_at, s.last_activity_at);
    const lbl = sessionVisitorLabel(s);
    const pill = lbl === 'Con cita' ? 'completed' : lbl === 'Prospecto' ? 'pending' : 'cancelled';
    return `
    <tr>
      <td style="font-family:monospace;font-size:.72rem;color:var(--text2);cursor:pointer" title="Abrir transcripción" onclick="viewSessionMessages('${(s.session_id || '').replace(/'/g, "\\'")}')">${escapeCell(shortId)}</td>
      <td>${escapeCell(started)}</td>
      <td>${escapeCell(dur)}</td>
      <td style="text-align:center">${s.message_count ?? 0}</td>
      <td>${sessionDevice(s)}</td>
      <td><span class="status-pill ${pill}">${escapeCell(lbl)}</span></td>
    </tr>`;
  }).join('') || '<tr><td colspan="6" style="padding:20px;color:var(--text3)">Aún no hay sesiones.</td></tr>';
}

function buildServicesTable() {
  const svc = (OVERVIEW && OVERVIEW.services) ? OVERVIEW.services : [];
  const max = Math.max(1, ...svc.map((x) => x.bookings));
  const tbody = document.getElementById('servicesBody');
  tbody.innerHTML = svc.map((s, i) => {
    const pct = Math.round((s.bookings / max) * 100);
    return `
    <tr>
      <td style="color:var(--text3);font-size:.75rem">${String(i + 1).padStart(2, '0')}</td>
      <td class="td-name">${escapeCell(s.name)}</td>
      <td class="td-amount">€${s.price}</td>
      <td>${s.bookings}</td>
      <td class="td-amount">€${Number(s.revenue).toLocaleString()}</td>
      <td style="width:140px">
        <div class="service-bar-track"><div class="service-bar-fill" style="width:${pct}%"></div></div>
        <div style="font-size:.65rem;color:var(--text3);margin-top:3px">${pct}% del máximo</div>
      </td>
      <td style="color:var(--text3);font-size:.8rem">En vivo</td>
    </tr>`;
  }).join('') || '<tr><td colspan="7" style="padding:16px;color:var(--text3)">No hay estadísticas hasta que existan reservas.</td></tr>';
}

function buildHeatmap(levels) {
  const labels = document.getElementById('heatmapLabels');
  const grid   = document.getElementById('heatmapGrid');
  if (!labels || !grid) return;
  labels.innerHTML = '';
  grid.innerHTML = '';
  ['L','M','X','J','V','S','D'].forEach((d) => {
    const el = document.createElement('div');
    el.className = 'heatmap-day-label';
    el.textContent = d;
    labels.appendChild(el);
  });
  const arr = (levels && levels.length === 84) ? levels : Array(84).fill(0);
  for (let i = 0; i < 84; i++) {
    const cell = document.createElement('div');
    cell.className = 'heatmap-cell';
    const lv = Math.min(5, Math.max(0, Number(arr[i]) || 0));
    cell.setAttribute('data-level', String(lv));
    grid.appendChild(cell);
  }
}

function pctDeltaText(cur, prev) {
  if (prev == null || prev === 0) return cur > 0 ? { text: 'new', cls: 'up' } : { text: '—', cls: '' };
  const p = Math.round(((cur - prev) / prev) * 100);
  return { text: `${p >= 0 ? '↑' : '↓'} ${Math.abs(p)}%`, cls: p >= 0 ? 'up' : 'down' };
}

function setDeltaEl(id, cur, prev) {
  const el = document.getElementById(id);
  if (!el) return;
  const { text, cls } = pctDeltaText(cur, prev);
  el.textContent = text;
  el.className = 'stat-change' + (cls ? ' ' + cls : '');
}

function setAbsDeltaEl(id, cur, prev, suffix = '') {
  const el = document.getElementById(id);
  if (!el) return;
  const d = cur - prev;
  if (prev === 0 && cur === 0) {
    el.textContent = '—';
    el.className = 'stat-change';
    return;
  }
  el.textContent = d === 0 ? '—' : `${d > 0 ? '↑' : '↓'} ${Math.abs(d)}${suffix}`;
  el.className = 'stat-change ' + (d >= 0 ? 'up' : 'down');
}

function buildTodaySchedule(ov) {
  const container = document.getElementById('apptTodayList');
  const sub = document.getElementById('dash-today-schedule-sub');
  if (!container) return;
  const today = (ov.kpi && ov.kpi.shopDateToday) || new Date().toISOString().slice(0, 10);
  const rows = (ov.appointments || []).filter((a) => {
    const cap = (a.captured_at || '').slice(0, 10);
    const pref = (a.preferred_date || '').slice(0, 10);
    return cap === today || pref === today;
  }).slice(0, 8);

  if (sub) sub.textContent = rows.length ? `${rows.length} hoy · de reservas` : 'Aún no hay reservas con fecha de hoy';

  if (!rows.length) {
    container.innerHTML = '<div style="padding:20px;color:var(--text3);font-size:.85rem">No hay citas de hoy en la base de datos. Abre Citas para ver la lista completa.</div>';
    return;
  }

  const pill = (st) => {
    const x = String(st || 'pending').toLowerCase();
    if (x === 'completed') return '<span class="status-pill completed">✓ Hecho</span>';
    if (x === 'cancelled') return '<span class="status-pill cancelled">✕ Cancelada</span>';
    if (x === 'confirmed') return '<span class="status-pill confirmed">● Confirmed</span>';
    return '<span class="status-pill pending">● Pending</span>';
  };

  container.innerHTML = rows.map((a) => {
    const t = (a.preferred_time || '—').trim();
    const parts = t.match(/^(\d{1,2}):(\d{2})/);
    let hh = '—';
    let apm = '';
    if (parts) {
      let h = parseInt(parts[1], 10);
      apm = h >= 12 ? 'PM' : 'AM';
      h = h % 12 || 12;
      hh = String(h) + ':' + parts[2];
    }
    const amt = a.amount_eur != null ? '€' + Number(a.amount_eur).toFixed(0) : '—';
    return `<div class="appt-item">
      <div class="appt-time-block"><div class="appt-time">${escapeCell(hh)}</div><div class="appt-period">${escapeCell(apm || '—')}</div></div>
      <div class="appt-divider"></div>
      <div class="appt-info"><div class="appt-name">${escapeCell(a.name)}</div><div class="appt-service">${escapeCell(a.service)}</div></div>
      <div class="appt-right">${pill(a.appointment_status)}<div class="appt-price">${escapeCell(amt)}</div></div>
    </div>`;
  }).join('');
}

function buildInsightServiceBars(ov) {
  const el = document.getElementById('insightServiceBars');
  if (!el) return;
  const monthStart = new Date();
  monthStart.setUTCDate(1);
  monthStart.setUTCHours(0, 0, 0, 0);
  const rows = (ov.leads || []).filter((l) => {
    const c = l.captured_at ? new Date(l.captured_at).getTime() : 0;
    return c >= monthStart.getTime();
  });
  const bySvc = {};
  rows.forEach((l) => {
    const n = l.service || '—';
    if (!bySvc[n]) bySvc[n] = { revenue: 0, bookings: 0 };
    bySvc[n].bookings += 1;
    bySvc[n].revenue += Number(l.amount_eur) || 0;
  });
  const list = Object.entries(bySvc).map(([name, v]) => ({ name, ...v })).sort((a, b) => b.revenue - a.revenue).slice(0, 8);
  const maxR = Math.max(1, ...list.map((x) => x.revenue));
  el.innerHTML = list.length ? list.map((s) => {
    const pct = Math.round((s.revenue / maxR) * 100);
    return `<div class="service-bar-item"><div class="service-bar-label"><span>${escapeCell(s.name)}</span><span>€${Math.round(s.revenue).toLocaleString('es-ES')} · ${s.bookings} reservas</span></div><div class="service-bar-track"><div class="service-bar-fill" style="width:${pct}%"></div></div></div>`;
  }).join('') : '<div style="padding:16px;color:var(--text3)">Aún no hay reservas en el mes actual.</div>';
}

function buildRevenueGoalsBars(ov) {
  const el = document.getElementById('revenueGoalsBars');
  if (!el) return;
  const mRev = ov.monthlyRev || [];
  const mLbl = ov.monthlyRevLabels || [];
  const n = mRev.length;
  const take = Math.min(4, n);
  const start = Math.max(0, n - take);
  const slice = [];
  for (let i = start; i < n; i++) slice.push({ rev: mRev[i] || 0, lbl: mLbl[i] || `M${i + 1}` });
  const maxIn6 = Math.max(1, ...mRev.slice(Math.max(0, n - 6)));
  const target = maxIn6 * 1.1;
  el.innerHTML = slice.length ? slice.map((x) => {
    const pct = Math.min(100, Math.round(((x.rev || 0) / target) * 100));
    return `<div class="service-bar-item" style="margin-bottom:12px"><div class="service-bar-label"><span>${escapeCell(x.lbl)}</span><span>€${Math.round(x.rev).toLocaleString('en-GB')} / target €${Math.round(target).toLocaleString('en-GB')}</span></div><div class="service-bar-track"><div class="service-bar-fill" style="width:${pct}%"></div></div></div>`;
  }).join('') : '<div style="padding:12px;color:var(--text3)">No monthly data yet.</div>';
}

function hideAdminLoadBanner() {

let adminBootComplete = false;

function setLoaderStatus(text) {
  const s = document.getElementById('adminLoaderStatus');
  if (s) s.textContent = text;
}

function showBootLoader() {
  const root = document.getElementById('adminLoader');
  const err = document.getElementById('adminLoaderError');
  const retry = document.getElementById('adminLoaderRetry');
  if (!root) return;
  root.classList.remove('is-hidden');
  root.setAttribute('aria-busy', 'true');
  if (err) {
    err.hidden = true;
    err.innerHTML = '';
  }
  if (retry) retry.hidden = true;
  setLoaderStatus('Loading dashboard data…');
}

function hideBootLoader() {
  const root = document.getElementById('adminLoader');
  if (!root) return;
  root.classList.add('is-hidden');
  root.setAttribute('aria-busy', 'false');
}

function showBootLoaderError(html) {
  const err = document.getElementById('adminLoaderError');
  const retry = document.getElementById('adminLoaderRetry');
  if (err) {
    err.innerHTML = html;
    err.hidden = false;
  }
  if (retry) retry.hidden = false;
  setLoaderStatus('No se pudieron cargar los datos.');
}

async function loadAdminData(opts = {}) {
  const silent = !!opts.silent;
  if (!silent && !adminBootComplete) {
    showBootLoader();
  }

  let r;
  try {
    r = await adminFetch('/api/admin/overview');
  } catch (e) {
    if (!silent && !adminBootComplete) {
      showBootLoaderError('Network error: ' + escapeCell(String(e && e.message ? e.message : e)));
    } else if (silent) {
      showAdminLoadBanner('Falló la actualización: ' + escapeCell(String(e && e.message ? e.message : e)));
    }
    return;
  }

  if (r.status === 401) {
    if (hasStoredOrUrlCredential()) {
      logoutToGate();
      setAuthGateError('authErrLogin', 'Sesión caducada o inválida. Vuelve a entrar.');
      return;
    }
    if (!silent && !adminBootComplete) {
      showBootLoaderError('Este servidor requiere acceso o un token de administración. Usa correo y contraseña, o añade <code>?token=…</code> si utilizas <code>ADMIN_TOKEN</code>.');
    } else {
      showAdminLoadBanner('La API de administración devolvió 401. Vuelve a entrar o abre con <code>?token=…</code> si el servidor usa un token estático.');
    }
    return;
  }
  if (!r.ok) {
    const t = await r.text();
    if (!silent && !adminBootComplete) {
      showBootLoaderError('No se pudieron cargar los datos. ¿La API está en marcha?<br><br>' + escapeCell(t.slice(0, 400)));
    } else {
      showAdminLoadBanner('No se pudieron cargar los datos. ¿La API está en marcha? ' + escapeCell(t.slice(0, 200)));
    }
    return;
  }

  hideAdminLoadBanner();
  let json;
  try {
    json = await r.json();
  } catch (e) {
    if (!silent && !adminBootComplete) {
      showBootLoaderError('Invalid response from server.');
    }
    return;
  }

  OVERVIEW = json;
  applyDashboardKpi(OVERVIEW);
  buildApptTable();
  buildLeadsTable();
  buildLeadCards();
  buildVisitorsTable();
  buildServicesTable();
  buildHeatmap(OVERVIEW.heatmap);
  renderActivityFeed(OVERVIEW.activities);
  initChartsFromOverview(OVERVIEW);

  adminBootComplete = true;
  hideBootLoader();
}

document.addEventListener('DOMContentLoaded', () => {
  const retryBtn = document.getElementById('adminLoaderRetry');
  if (retryBtn) {
    retryBtn.addEventListener('click', () => {
      adminBootComplete = false;
      loadAdminData({ silent: false });
    });
  }

  bootstrapAdmin();
  wireResponsiveSidebar();

  const ex = document.getElementById('btnExportCsv');
  if (ex) {
    ex.addEventListener('click', () => {
      const t = getAdminToken();
      const base = `${apiBase()}/api/leads/download`;
      const url = t ? `${base}?token=${encodeURIComponent(t)}` : base;
      window.open(url, '_blank');
    });
  }
  setInterval(() => {
    const app = document.getElementById('adminAppRoot');
    if (app && !app.classList.contains('is-hidden')) loadAdminData({ silent: true });
  }, 120000);
});
</script>
</body>
</html>
